ro-side\">\n          <p class=\"lede\">นี่คือ Platform Agentic AI สำหรับเจ้าของธุรกิจ E‑Commerce ที่เป็น Solo Entrepreneur แต่ละ Agent ดูแลงานเฉพาะด้าน ตั้งแต่การเงิน การตลาด กฎหมาย ไปจนถึงข่าวสารในตลาด และทำงานต่อเนื่องโดยไม่ต้องรอคำสั่ง<\/p>\n          <div class=\"cta-row\">\n            <a href=\"#app\" class=\"btn\">เริ่มใช้งาน<\/a>\n          <\/div>\n        <\/div>\n      <\/div>\n      <div class=\"hero-ant\">\n        <iframe src=\"ant-mascot.html?v=5\" title=\"มาสคอตมดแดงสวมหมวกทรงสุภาพบุรุษ กดเพื่อแกล้ง\" loading=\"eager\" allowtransparency=\"true\"><\/iframe>\n        <span class=\"ant-hint\">กดเพื่อแกล้ง<\/span>\n      <\/div>\n    <\/div>\n\n  <\/div>\n<\/header>\n\n<!-- AGENTS -->\n<section id=\"agents\" class=\"sec\" style=\"padding-top:40px\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\" style=\"grid-template-columns:minmax(0,1fr)\">\n      <h2>เป็น Solo Entrepreneur<br>แต่มีทีมครบทุกฝ่าย<\/h2>\n    <\/div>\n    <div class=\"agents\">\n      <sc-for list=\"{{ agents }}\" as=\"a\" hint-placeholder-count=\"6\">\n        <article class=\"agent\">\n          <div>\n            <div class=\"agent-name\"><h3 style=\"font:inherit\">{{ a.name }}<\/h3><\/div>\n            <div class=\"agent-role\">{{ a.role }}<\/div>\n          <\/div>\n          <ul>\n            <sc-for list=\"{{ a.tasks }}\" as=\"t\" hint-placeholder-count=\"3\">\n              <li><span>{{ t }}<\/span><\/li>\n            <\/sc-for>\n          <\/ul>\n        <\/article>\n      <\/sc-for>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ADVISOR -->\n<section id=\"advisor\" class=\"sec advisor\">\n  <div class=\"wrap\"><div class=\"advisor-shell\"><div class=\"advisor-grid\">\n    <div>\n      <h2>มี Secretary เลือก Agent ให้ ไม่ต้องนั่งเลือกเอง<\/h2>\n      <p style=\"margin-top:20px;font-size:17px;line-height:1.8;color:var(--ink-2);text-wrap:pretty\">Secretary วิเคราะห์ประเภทสินค้า ช่องทางขาย และแนวทางการทำธุรกิจของคุณ แล้วเรียกใช้ AI Agent ด้านที่เหมาะสมให้ ช่วยบริหารจัดการ Token ได้อย่างคุ้มค่า และกำหนดว่า Agent ตัวไหนควรส่งข้อมูลต่อกัน<\/p>\n      <dl class=\"points\">\n        <sc-for list=\"{{ advisorPoints }}\" as=\"p\" hint-placeholder-count=\"3\">\n          <div><dt>{{ p.t }}<\/dt><dd>{{ p.d }}<\/dd><\/div>\n        <\/sc-for>\n      <\/dl>\n    <\/div>\n    <div class=\"map\">\n      <h3>แผนผังการเชื่อม Agent · {{ cur.label }}<\/h3>\n      <ul class=\"map-list\">\n        <sc-for list=\"{{ nodeGrid }}\" as=\"nd\" hint-placeholder-count=\"6\">\n          <li class=\"map-row\" data-in=\"{{ nd.inChain }}\">\n            <span>{{ nd.name }}<\/span>\n            <span class=\"data\" style=\"text-align:right\">{{ nd.pct }}%<\/span>\n            <span class=\"step data\">{{ nd.step }}<\/span>\n          <\/li>\n        <\/sc-for>\n      <\/ul>\n      <p class=\"map-foot\"><b>ลำดับที่แนะนำ: <\/b>{{ chainText }}<\/p>\n    <\/div>\n  <\/div><\/div><\/div>\n<\/section>\n\n<!-- ORACLE -->\n<section id=\"oracle\" class=\"sec oracle\" style=\"padding-top:0\">\n  <div class=\"wrap\"><div class=\"oracle-shell\">\n    <h2>ช่วยประเมินแนวทางการเติบโตของตลาดคุณ<\/h2>\n    <p class=\"lede2\">Market & Industry Update ค้นหาและดึงข้อมูลในแต่ละวัน คัดเฉพาะที่เกี่ยวกับธุรกิจของคุณ ย่อยและสรุปผล แล้วทำนายว่าแนวโน้มจะไปทางไหน พร้อมแนวทางที่ควรทำต่อ<\/p>\n\n    <ol class=\"steps\">\n      <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"5\">\n        <li>\n          <div class=\"n data\">{{ s.n }}<\/div>\n          <div class=\"t\">{{ s.t }}<\/div>\n          <div class=\"d\">{{ s.d }}<\/div>\n        <\/li>\n      <\/sc-for>\n    <\/ol>\n\n    <div class=\"forecast\">\n      <div class=\"fc\">\n        <div class=\"fc-head\">\n          <div>\n            <div class=\"fc-label\">คาดการณ์ 90 วันข้างหน้า<\/div>\n            <div class=\"fc-trend\">{{ cur.trend }}<\/div>\n          <\/div>\n          <div class=\"fc-num num\">{{ cur.forecast }}<\/div>\n        <\/div>\n        <svg sc-camel-view-box=\"0 0 600 220\" role=\"img\" aria-label=\"กราฟข้อมูลย้อนหลัง 24 เดือนและช่วงคาดการณ์\">\n          <line x1=\"0\" y1=\"55\" x2=\"600\" y2=\"55\" stroke=\"oklch(0.92 0.014 355)\"><\/line>\n          <line x1=\"0\" y1=\"110\" x2=\"600\" y2=\"110\" stroke=\"oklch(0.92 0.014 355)\"><\/line>\n          <line x1=\"0\" y1=\"165\" x2=\"600\" y2=\"165\" stroke=\"oklch(0.92 0.014 355)\"><\/line>\n          <polygon points=\"380,118 430,92 480,80 530,56 600,34 600,96 530,110 480,124 430,128 380,118\" fill=\"oklch(0.865 0.085 358 / .45)\"><\/polygon>\n          <polyline points=\"0,170 40,160 80,166 120,148 160,152 200,138 240,144 280,126 320,132 380,118\" fill=\"none\" stroke=\"oklch(0.3 0.03 350)\" stroke-width=\"2.5\" stroke-linejoin=\"round\"><\/polyline>\n          <polyline points=\"380,118 430,110 480,102 530,84 600,66\" fill=\"none\" stroke=\"oklch(0.6 0.19 356)\" stroke-width=\"2.5\" stroke-dasharray=\"7 6\" stroke-linejoin=\"round\"><\/polyline>\n          <line x1=\"380\" y1=\"10\" x2=\"380\" y2=\"210\" stroke=\"oklch(0.82 0.04 355)\"><\/line>\n          <circle cx=\"380\" cy=\"118\" r=\"5\" fill=\"oklch(0.6 0.19 356)\"><\/circle>\n        <\/svg>\n        <div class=\"fc-axis\"><span>ข้อมูลย้อนหลัง 24 เดือน<\/span><span>วันนี้<\/span><span>คาดการณ์<\/span><\/div>\n      <\/div>\n      <div class=\"recs\">\n        <h3>แนวทางที่แนะนำ<\/h3>\n        <ol>\n          <sc-for list=\"{{ recs }}\" as=\"r\" hint-placeholder-count=\"3\">\n            <li><span class=\"data\">{{ r.n }}<\/span><span>{{ r.t }}<\/span><\/li>\n          <\/sc-for>\n        <\/ol>\n        <p>ทุกคำทำนายแสดงแหล่งข้อมูลและระดับความมั่นใจ เพื่อให้คุณตัดสินใจเองได้<\/p>\n      <\/div>\n    <\/div>\n  <\/div><\/div>\n<\/section>\n\n<!-- PRICING -->\n<section id=\"pricing\" class=\"sec\">\n  <div class=\"wrap\">\n    <div class=\"pricing-head\">\n      <h2>จ่ายเท่าที่ธุรกิจคุณใช้<\/h2>\n      <div class=\"toggle\" role=\"group\" aria-label=\"รอบการเรียกเก็บเงิน\">\n        <button sc-camel-on-click=\"{{ setMonthly }}\" aria-pressed=\"{{ mOn }}\">รายเดือน<\/button>\n        <button sc-camel-on-click=\"{{ setYearly }}\" aria-pressed=\"{{ yOn }}\">รายปี <b>ถูกกว่า 0%<\/b><\/button>\n      <\/div>\n    <\/div>\n    <div class=\"plans plans-one\">\n      <sc-for list=\"{{ plans }}\" as=\"pl\" hint-placeholder-count=\"3\">\n        <div class=\"plan\" data-hot=\"{{ pl.hotS }}\">\n          <div class=\"plan-name\"><span>{{ pl.name }}<\/span>\n            <sc-if value=\"{{ pl.hot }}\" hint-placeholder-val=\"{{ false }}\"><small>แนะนำ<\/small><\/sc-if>\n          <\/div>\n          <div class=\"plan-desc\">{{ pl.desc }}<\/div>\n          <div class=\"price num\">฿{{ pl.price }}<small>/ เดือน<\/small><\/div>\n          <div class=\"bill\">{{ pl.billNote }}<\/div>\n          <a href=\"#app\" class=\"btn\">เริ่มทดลองใช้<\/a>\n          <ul class=\"feat\">\n            <sc-for list=\"{{ pl.features }}\" as=\"ft\" hint-placeholder-count=\"5\">\n              <li><svg width=\"14\" height=\"14\" viewBox=\"0 0 14 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\"><path d=\"M2 7.5l3.2 3L12 3.5\"><\/path><\/svg><span>{{ ft }}<\/span><\/li>\n            <\/sc-for>\n          <\/ul>\n        <\/div>\n      <\/sc-for>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- FAQ -->\n<section id=\"faq\" class=\"sec\" style=\"padding-top:24px\">\n  <div class=\"wrap faq-wrap\">\n    <h2 class=\"faq-title\">คำถามที่พบบ่อย<\/h2>\n    <div class=\"faqs\">\n      <sc-for list=\"{{ faqs }}\" as=\"q\" hint-placeholder-count=\"6\">\n        <div class=\"faq\" data-open=\"{{ q.on }}\">\n          <button sc-camel-on-click=\"{{ q.toggle }}\" aria-expanded=\"{{ q.on }}\">\n            <span>{{ q.q }}<\/span>\n            <span class=\"ic\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" aria-hidden=\"true\"><path d=\"M10 3v14M3 10h14\"><\/path><\/svg><\/span>\n          <\/button>\n          <div class=\"a\" style=\"grid-template-rows:{{ q.rows }}\">\n            <div><p>{{ q.a }}<\/p><\/div>\n          <\/div>\n        <\/div>\n      <\/sc-for>\n    <\/div>\n    <p class=\"faq-contact\">ไม่พบคำตอบที่ต้องการ? ติดต่อทีมงานได้ที่ <a class=\"u\" href=\"mailto:XXX@gmail.com\">XXX@gmail.com<\/a><\/p>\n  <\/div>\n<\/section>\n\n<!-- CTA -->\n<section class=\"cta-wrap\">\n  <div class=\"wrap\"><div class=\"cta\">\n    <h2>ให้ทีม AI ช่วยพาธุรกิจของคุณไปให้ถึงฝัน เริ่มได้ตั้งแต่ตอนนี้<\/h2>\n    <p>แค่สมัคร Plan ก็เริ่มใช้งานได้ทันที ไม่ต้องผูกกับร้านค้า<\/p>\n    <div class=\"cta-row\" style=\"margin-top:30px\">\n      <a href=\"#app\" class=\"btn\">เริ่มใช้งาน<\/a>\n    <\/div>\n  <\/div><\/div>\n<\/section>\n<\/main>\n\n<footer class=\"foot\">\n  <div class=\"wrap\">\n    <div class=\"foot-grid\">\n      <div class=\"foot-brand\">\n        <div class=\"brand\">\n          <svg width=\"26\" height=\"26\" viewBox=\"0 0 26 26\" aria-hidden=\"true\"><circle cx=\"13\" cy=\"11\" r=\"7\" fill=\"oklch(0.76 0.13 358)\"><\/circle><rect x=\"2\" y=\"17\" width=\"22\" height=\"2.5\" fill=\"oklch(0.23 0.035 350)\"><\/rect><rect x=\"6\" y=\"21.5\" width=\"14\" height=\"2.5\" fill=\"oklch(0.23 0.035 350)\"><\/rect><\/svg>\n          Solora\n        <\/div>\n        <p>Platform Agentic AI สำหรับผู้ประกอบการ E‑Commerce ที่เป็น Solo Entrepreneur<\/p>\n        <div class=\"badges\"><span>PDPA Compliant<\/span><span>เข้ารหัสข้อมูล AES‑256<\/span><\/div>\n      <\/div>\n      <sc-for list=\"{{ footCols }}\" as=\"col\" hint-placeholder-count=\"4\">\n        <div>\n          <h4>{{ col.h }}<\/h4>\n          <ul>\n            <sc-for list=\"{{ col.items }}\" as=\"it\" hint-placeholder-count=\"4\">\n              <li><a href=\"#\">{{ it }}<\/a><\/li>\n            <\/sc-for>\n          <\/ul>\n        <\/div>\n      <\/sc-for>\n    <\/div>\n    <div class=\"legal\">\n      <span>© 2026 Solora AI Co., Ltd. สงวนลิขสิทธิ์<\/span>\n      <span>กรุงเทพฯ ประเทศไทย · XXX@gmail.com<\/span>\n    <\/div>\n  <\/div>\n<\/footer>\n<\/div>\n\n<\/x-dc>\n<script type=\"t },\n  food: { label: 'อาหาร & เครื่องดื่ม', mix: { finance: 24, legal: 20, marketing: 20, market: 14, oracle: 12, daily: 10 }, chain: ['finance', 'legal', 'marketing'], note: 'มาร์จิ้นบางและต้นทุนวัตถุดิบผันผวน Finance ควรนำ ส่วน Legal ดูฉลากและใบอนุญาต ก่อนส่งต่อให้ Marketing', trend: 'เครื่องดื่มลดน้ำตาลกลุ่มวัยทำงาน', forecast: '+11%' },\n  home: { label: 'ของแต่งบ้าน', mix: { marketing: 26, finance: 22, oracle: 18, market: 16, daily: 10, legal: 8 }, chain: ['oracle', 'finance', 'marketing'], note: 'สินค้าชิ้นใหญ่ ค่าส่งสูง Oracle คาดการณ์ช่วงขายดี Finance คำนวณต้นทุนขนส่ง แล้ว Marketing เลือกช่วงยิงโฆษณา', trend: 'ของแต่งคอนโดขนาดเล็กช่วงต้นปี', forecast: '+9%' },\n  baby: { label: 'แม่และเด็ก', mix: { legal: 24, marketing: 24, market: 16, finance: 14, oracle: 12, daily: 10 }, chain: ['legal', 'market', 'marketing'], note: 'ลูกค้าให้ความสำคัญกับความปลอดภัยของสินค้า Legal ตรวจมาตรฐาน มอก. และรีวิว Market Update ดูคู่แข่ง ก่อนให้ Marketing สื่อสาร', trend: 'ของเล่นเสริมพัฒนาการวัย 1–3 ปี', forecast: '+13%' }\n};\nconst FEED = [\n  { code: 'MI', text: 'พบคู่แข่ง 3 ร้านลดราคาสินค้าขายดีของคุณ 8%' },\n  { code: 'FN', text: 'กระแสเงินสดสัปดาห์นี้เป็นบวก ฿42,300 ค่าโฆษณาเกินงบ 6%' },\n  { code: 'LG', text: 'ตรวจคำโฆษณา 12 ชิ้น ต้องแก้ 1 ชิ้นก่อนเผยแพร่' },\n  { code: 'OR', text: 'คาดการณ์ความต้องการช่วง 30 วันข้างหน้าเพิ่มขึ้น' },\n  { code: 'MK', text: 'ร่างแคมเปญ 11.11 พร้อมแคปชันและภาพ 4 ชุด' },\n  { code: 'DL', text: 'ส่งสรุปเช้าวันนี้แล้ว: ยอดขายเมื่อวาน +12%' }\n];\nconst AGENTS = [\n  { code: 'FN', name: 'Finance Agent', role: 'การเงิน บัญชี และกระแสเงินสด', status: 'ทำงานอยู่', tasks: ['ติดตามรายรับรายจ่ายและกำไรต่อออเดอร์', 'เตือนเมื่อต้นทุนโฆษณาหรือค่าส่งสูงผิดปกติ', 'สรุปภาษีและเอกสารที่ต้องเตรียมรายเดือน'] },\n  { code: 'MK', name: 'Marketing Agent', role: 'คอนเทนต์ โฆษณา และโปรโมชัน', status: 'ทำงานอยู่', tasks: ['เขียนคำบรรยายสินค้าและแคปชันโซเชียล', 'วางแผนแคมเปญตามวันขายสำคัญ', 'วิเคราะห์ผลโฆษณาและแนะนำการปรับงบ'] },\n  { code: 'LG', name: 'Legal Agent', role: 'กฎหมาย ข้อบังคับ และความเสี่ยง', status: 'เฝ้าระวัง', tasks: ['ตรวจข้อความโฆษณาให้ถูกต้องตามข้อกำหนด', 'ติดตามกฎหมายคุ้มครองผู้บริโภคและ PDPA', 'ร่างนโยบายคืนสินค้าและข้อตกลงการใช้งาน'] },\n  { code: 'MI', name: 'Market & Industry Update', role: 'ข่าวตลาด คู่แข่ง และอุตสาหกรรม', status: 'ทำงานอยู่', tasks: ['ติดตามราคาและโปรโมชันของคู่แข่ง', 'สรุปข่าวอุตสาหกรรมที่กระทบสินค้าของคุณ', 'แจ้งเตือนสินค้าหรือเทรนด์ที่เริ่มมาแรง'] },\n  { code: 'DL', name: 'Daily Update', role: 'สรุปประจำวันในข้อความเดียว', status: 'ส่งทุก 08:00', tasks: ['รวมผลงานของทุก Agent เป็นสรุปสั้นๆ', 'จัดลำดับสิ่งที่ต้องตัดสินใจวันนี้', 'ส่งผ่านอีเมลหรือแอปแชตที่คุณใช้'] },\n  { code: 'OP', name: 'Operations Agent', role: 'สต็อก ออเดอร์ และการจัดส่ง', status: 'Agent เสริม', tasks: ['คาดการณ์สต็อกที่ใกล้หมดและเวลาสั่งเพิ่ม', 'ติดตามออเดอร์ที่ส่งล่าช้า', 'ตอบคำถามลูกค้าเรื่องสถานะพัสดุ'] }\n];\n\nclass Component extends DCLogic {\n  state = { ind: this.props.defaultIndustry ?? 'it', yearly: (this.props.defaultBilling ?? 'yearly') === 'yearly', open: 0, tick: 0 };\n\n  componentDidMount() {\n    this.timer = setInterval(() => this.setState(s => ({ tick: s.tick + 1 })), 3200);\n  }\n  componentWillUnmount() { clearInterval(this.timer); }\n\n  renderVals() {\n    const { ind, yearly, open, tick } = this.state;\n    const cur = { key: ind, ...IND[ind] };\n    const sorted = Object.entries(cur.mix).sort((a, b) => b[1] - a[1]);\n    const top = sorted[0][0];\n    const pink = 'oklch(0.84 0.09 358)', ink = 'oklch(0.22 0.02 330)';\n\n    const industries = Object.entries(IND).map(([k, v]) => {\n      const on = k === ind;\n      return { label: v.label, pick: () => this.setState({ ind: k }), on: on ? 'true' : 'false' };\n    });\n    const mixRows = sorted.map(([k, p], i) => ({ name: NAMES[k], pct: p, w: (p / sorted[0][1] * 100) + '%', top: i === 0 ? 'true' : 'false' }));\n    const chain = cur.chain.map((k, i) => ({ name: NAMES[k], arrow: i < cur.chain.length - 1 }));\n    const feed = [0, 1, 2, 3].map(i => {\n      const f = FEED[(tick + i) % FEED.length];\n      return { ...f, t: ['เพิ่งเสร็จ', '2 นาที', '9 นาที', '21 นาที'][i], o: 1 - i * 0.18 };\n    });\n    const order = ['market', 'oracle', 'marketing', 'finance', 'legal', 'daily'];\n    const nodeGrid = order.map(k => {\n      const inChain = cur.chain.includes(k);\n      return { code: CODES[k], name: NAMES[k], pct: cur.mix[k], inChain: inChain ? 'true' : 'false', step: inChain ? String(cur.chain.indexOf(k) + 1) : '' };\n    });\n\n    const fmt = n => n.toLocaleString('en-US');\n    const plans = [\n      { name: 'Plan Demo', desc: 'สำหรับทดลองใช้งานก่อนตัดสินใจ', hot: false, hotS: 'true', price: '0', billNote: '',\n        features: ['Agent หลักครบ 6 ตัว', 'Secretary จัดสรร Token อัตโนมัติ', 'Market & Industry Update รายงานแนวโน้มรายสัปดาห์'] }\n    ];\n    const faqData = [\n      ['ทำไมต้องเลือก Solora แทนการใช้แชตบอต AI ทั่วไป?', 'แชตบอตทั่วไปตอบเมื่อคุณถาม แต่ Solora มี Agent หลายตัวที่รู้จักร้านของคุณ เชื่อมกับข้อมูลยอดขายจริง และทำงานต่อเนื่องเอง เช่น เฝ้าราคาคู่แข่งหรือตรวจคำโฆษณา จากนั้นสรุปมาให้คุณตัดสินใจ คุณไม่ต้องเขียนพรอมต์ใหม่ทุกครั้ง'],\n      ['Agent ทำงานตลอดเวลาโดยไม่ต้องสั่งจริงหรือไม่?', 'จริง แต่ละ Agent มีรอบการทำงานของตัวเอง เช่น Market & Industry Update ตรวจข่าวและราคาทุกชั่วโมง Daily Update ส่งสรุปทุกเช้า คุณยังสั่งงานเพิ่มหรือหยุด Agent ตัวไหนก็ได้ทุกเมื่อ'],\n      ['Market & Industry Update ทำนายแม่นยำแค่ไหน?', 'Market & Industry Update ใช้ข้อมูลย้อนหลังของร้าน ข้อมูลตลาด และข่าวที่เกี่ยวข้องมาสร้างคาดการณ์ ทุกผลลัพธ์แสดงระดับความมั่นใจและแหล่งข้อมูลที่ใช้ ควรใช้เป็นข้อมูลประกอบการตัดสินใจ ไม่ใช่คำรับประกันผล'],\n      ['ยกเลิกได้ตลอดเวลาหรือไม่?', 'ได้ ยกเลิกได้จากหน้าตั้งค่า ไม่มีสัญญาผูกมัด']\n    ];\n    const faqs = faqData.map(([q, a], i) => {\n      const on = open === i;\n      return { q, a, toggle: () => this.setState({ open: on ? -1 : i }), rows: on ? '1fr' : '0fr', on: on ? 'true' : 'false' };\n    });\n\n    return {\n      industries, cur, mixRows, chain, te=\"off\"><\/label>\n    <div class=\"fld\">สี\n      <div class=\"swatches\" id=\"f-colors\"><\/div>\n    <\/div>\n    <label class=\"fld\">ทีม<select id=\"f-team\"><\/select><\/label>\n    <div class=\"err\" id=\"f-err\" role=\"alert\"><\/div>\n    <div class=\"dlg-actions\">\n      <button class=\"ws-btn\" type=\"button\" id=\"f-cancel\">ยกเลิก<\/button>\n      <button class=\"ws-btn primary\" type=\"submit\">เพิ่มพนักงาน<\/button>\n    <\/div>\n  <\/form>\n<\/dialog>\n\n<dialog id=\"pf\">\n  <div class=\"pf-3d\"><iframe id=\"pf-frame\" title=\"โมเดล 3D ของพนักงาน AI\"><\/iframe><\/div>\n  <div class=\"pf-body\">\n    <h3 id=\"pf-name\"><\/h3>\n    <div class=\"pf-pat\" id=\"pf-pat\"><\/div>\n    <div class=\"fld\"><span class=\"pf-sec\">สีประจำตัว<\/span>\n      <div class=\"swatches\" id=\"pf-colors\"><\/div>\n    <\/div>\n    <div class=\"dlg-actions\"><button class=\"ws-btn primary\" type=\"button\" id=\"pf-close\">ปิด<\/button><\/div>\n  <\/div>\n<\/dialog>\n\n<iframe id=\"avsvc\" data-src=\"ant-mascot.html?snap=1\" title=\"\" aria-hidden=\"true\" tabindex=\"-1\" style=\"position:absolute;width:1px;height:1px;border:0;opacity:0;pointer-events:none;left:-9px;top:-9px\"><\/iframe><\/div>\n<script>\n(() => {\n  const SWATCHES = ['#E2513F', '#FA70AB', '#DD6ADC', '#A25BFF', '#4778FF', '#00B1FF', '#04BB9F', '#B6D80B', '#FFCC38', '#FF8066'];\n  const KEY = 'solora.workspace.v2', AVKEY = 'solora.avatars.v1';\n  const $ = s => document.querySelector(s);\n  const uid = () => Math.random().toString(36).slice(2, 9);\n  const stamp = () => 'วันนี้ ' + new Date().toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit', hour12:false});\n\n  /* Each role = one look on the ant model (accessory style + default colour) and its own way of opening a conversation. */\n  const ROLES = {\n    secretary:{label:'Secretary', name:'Secretary', chip:'Secretary', style:'gentleman', color:'#E2513F', fixed:true,\n      pattern:'ถามก่อนว่าวันนี้ต้องการอะไร แล้วเลือกและส่งต่อให้ Agent ที่เหมาะสมในทีม คุณไม่ต้องเลือกเอง',\n      hello:['สวัสดีครับ ผมเป็น Secretary ประจำทีมนี้ ทุกเรื่องบอกผมได้เลย ผมจะเลือกและส่งต่อให้ Agent ที่เหมาะสมให้\\n\\nวันนี้อยากให้ช่วยเรื่องอะไรครับ?'],\n      quick:['สรุปว่าวันนี้มีอะไรต้องทำ', 'อยากรู้กำไรสัปดาห์นี้', 'ช่วยร่างแคปชันสินค้าใหม่']},\n    finance:{label:'การเงิน', name:'Finance Agent', chip:'การเงิน', style:'royal', color:'#FFCC38',\n      pattern:'เริ่มจากตัวเลข ถามช่วงเวลาและขอบเขตก่อน แล้วตอบเป็นข้อสั้นๆ',\n      hello:['สวัสดีครับ ผมดูแลตัวเลขการเงินของร้านคุณ\\n\\nขอถามก่อนเพื่อให้ตัวเลขตรงครับ: อยากดูช่วงไหน (สัปดาห์นี้ / เดือนนี้ / ไตรมาส) และเน้นเรื่องอะไร (กำไร / ค่าโฆษณา / กระแสเงินสด)?'],\n      quick:['สรุปรายรับรายจ่ายสัปดาห์นี้', 'ต้นทุนโฆษณาสูงผิดปกติไหม', 'เตรียมเอกสารภาษีรายเดือน'],\n      replies:['รับทราบครับ ผมจะสรุปเป็น 3 ข้อ: 1) รายรับ 2) รายจ่าย 3) กำไรสุทธิ\\n\\nตอนนี้เป็นโหมดเดโม ยังไม่มีตัวเลขจริง เมื่อเชื่อมร้านค้าแล้วผมจะใส่ให้ครับ', 'ได้ครับ ขอยืนยันช่วงเวลาอีกครั้งว่าเป็นสัปดาห์นี้ใช่ไหม ถ้าใช่ผมจะเทียบกับสัปดาห์ก่อนให้ด้วยครับ']},\n    marketing:{label:'การตลาด', name:'Marketing Agent', chip:'การตลาด', style:'artist', color:'#FA70AB',\n      pattern:'ถามเป้าหมายและกลุ่มลูกค้าก่อน แล้วเสนอทางเลือก 2–3 แบบให้เลือก',\n      hello:['สวัสดีครับ ผมช่วยคิดแคมเปญและคอนเทนต์\\n\\nเริ่มจากเป้าหมายก่อนนะครับ: อยากเพิ่มยอดขาย เพิ่มคนรู้จัก หรือดึงลูกค้าเก่ากลับมา และขายให้ใครเป็นหลัก?'],\n      quick:['ร่างแคปชันสินค้าใหม่', 'วางแผนแคมเปญ 11.11', 'วิเคราะห์ผลโฆษณาล่าสุด'],\n      replies:['เข้าใจแล้วครับ ผมมี 3 ทางให้เลือก: A) โปรโมชันลดราคา B) เล่าเรื่องแบรนด์ C) รีวิวจากลูกค้า อยากไปทางไหนก่อนครับ?\\n\\n(โหมดเดโม ยังไม่ใช้ข้อมูลร้านจริง)', 'ได้ครับ ขอกลุ่มลูกค้าหลักอีกนิดครับ แล้วผมจะร่างเวอร์ชันแรกให้เลือก 2 แบบ']},\n    legal:{label:'กฎหมาย', name:'Legal Agent', chip:'กฎหมาย', style:'scholar', color:'#4778FF',\n      pattern:'ระมัดระวัง ขอข้อความหรือเอกสารต้นฉบับก่อน และแจ้งข้อจำกัดให้ชัดเจน',\n      hello:['สวัสดีครับ ผมช่วยตรวจความเสี่ยงด้านกฎหมายเบื้องต้นให้ร้านค้า\\n\\nส่งข้อความโฆษณา นโยบาย หรือเอกสารที่อยากให้ตรวจมาได้เลยครับ ผมจะชี้จุดเสี่ยงและแนะนำวิธีแก้ ทั้งนี้เป็นข้อมูลเบื้องต้น ไม่ใช่คำปรึกษากฎหมายอย่างเป็นทางการ'],\n      quick:['ตรวจคำโฆษณาก่อนโพสต์', 'ร่างนโยบายคืนสินค้า', 'สรุปสิ่งที่ PDPA กำหนดกับร้านค้า'],\n      replies:['รับทราบครับ ผมต้องเห็นข้อความต้นฉบับเต็มก่อนจึงจะชี้จุดเสี่ยงได้ถูกต้อง ส่งมาได้เลยครับ\\n\\n(โหมดเดโม และเป็นข้อมูลเบื้องต้นเท่านั้น)', 'ได้ครับ ผมจะแยกเป็น: จุดที่เสี่ยง ระดับความเสี่ยง และวิธีแก้ที่แนะนำ']},\n    market:{label:'ตลาดและอุตสาหกรรม', name:'Market & Industry Update', chip:'ตลาด', style:'detective', color:'#04BB9F',\n      pattern:'ถามหมวดสินค้าและคู่แข่งก่อน แล้วสรุปพร้อมแหล่งข้อมูลและระดับความมั่นใจ',\n      hello:['สวัสดีครับ ผมติดตามตลาด คู่แข่ง และเทรนด์ให้\\n\\nบอกผมหน่อยครับ ร้านคุณขายสินค้าหมวดไหน และมีคู่แข่งรายไหนที่อยากให้จับตาเป็นพิเศษ?'],\n      quick:['คู่แข่งลดราคาอะไรบ้าง', 'เทรนด์ที่เริ่มมาแรงในหมวดของฉัน', 'คาดการณ์ความต้องการ 30 วันข้างหน้า'],\n      replies:['รับทราบครับ ผมจะสรุปเป็น: สิ่งที่เปลี่ยน แหล่งข้อมูล และระดับความมั่นใจ\\n\\n(โหมดเดโม ยังไม่ได้ดึงข้อมูลตลาดจริง)', 'ได้ครับ ขอหมวดสินค้ากับรายชื่อคู่แข่งหลักอีกนิด แล้วผมจะตั้งให้เฝ้าติดตามทุกวัน']},\n    daily:{label:'สรุปรายวัน', name:'Daily Update', chip:'สรุปรายวัน', style:'cool', color:'#00B1FF',\n      pattern:'สั้น เป็นข้อ เรียงตามสิ่งที่ต้องตัดสินใจก่อน',\n      hello:['อรุณสวัสดิ์ครับ ผมสรุปงานของทุก Agent ให้เป็นข้อสั้นๆ ทุกเช้า\\n\\nอยากรับสรุปเวลาไหน และทางช่องทางไหนครับ (อีเมล / แอปแชต)?'],\n      quick:['สรุปของเมื่อวาน', 'มีอะไรต้องตัดสินใจวันนี้', 'เปลี่ยนเวลารับสรุปเป็น 08:00'],\n      replies:['ตั้งไว้ให้แล้วครับ ทุกเช้าผมจะส่ง 3 ส่วน: ผลงานเมื่อวาน สิ่งที่ต้องตัดสินใจ และเรื่องที่ควรจับตา\\n\\n(โหมดเดโม)', 'ได้ครับ ขอเวลาที่ต้องการรับสรุปอีกครั้งครับ']},\n    ops:{label:'ปฏิบัติการ', name:'Operations Agent', chip:'ปฏิบัติการ', style:'athlete', color:'#FF8066',\n      pattern:'ถามเลขออเดอร์หรือรหัสสินค้า แล้วรายงานสถานะตรงๆ',\n      hello:['สวัสดีครับ ผมดูแลสต็อกและการจัดส่ง\\n\\nมีเลขออเดอร์หรือรหัสสินค้า (SKU) ที่อยากให้เช็กไหมครับ หรืออยากดูภาพรวมของที่ใกล้หมด?'],\n      quick:['สินค้าอะไรใกล้หมด', 'ออเดอร์ที่ส่งล่าช้า', 'สถานะพัสดุของลูกค้า'],\n      replies:['รับทราบครับ ขอเลขออเดอร์หรือ SKU เพื่อเช็กสถานะให้ตรงครับ\\n\\n(โหมดเดโม ยังไม่ได้เชื่อมระบบสต็อก)', 'ได้ครับ ผมจะรายงานเป็น: สถานะปัจจุบัน ที่ติดขัด และสิ่งที่ควรทำต่อ']},\n    support:{label:'ดูแลลูกค้า', name:'Customer Support Agent', chip:'ดูแลลูกค้า', style:'playful', color:'#A25BFF',\n      pattern:'ฟังปัญหาของลูกค้าก่อน ใช้น้ำเสียงอ่อนโยน แล้วค่อยเสนอทางแก้',\n      hello:['สวัสดีครับ ผมช่วยดูแลลูกค้าของร้านคุณ\\n\\nเล่าให้ฟังหน่อยครับว่าลูกค้ากำลังเจอปัญหาอะไร ผมจะช่วยร่างคำตอบที่สุภาพและตรงจุดให้'],\n      quick:['ร่างคำตอบลูกค้าที่ไม่พอใจ', 'ตอบเรื่องขอคืนสินค้า', 'สรุปคำถามที่ลูกค้าถามบ่อย'],\n      replies:['เข้าใจเลยครับ ผมจะเริ่มจากขอโทษและรับฟังก่อน แล้วค่อยเสนอทางแก้ 2 ข้อ\\n\\n(โหมดเดโม)', 'ได้ครับ ขอรายละเอียดคำสั่งซื้อของลูกค้าอีกนิด เพื่อให้คำตอบตรงที่สุด']},\n    analyst:{label:'วิเคราะห์ข้อมูล', name:'Data Analyst Agent', chip:'วิเคราะห์', style:'futuristic', color:'#B6D80B',\n      pattern:'ถามคำถามที่อยากรู้และแหล่งข้อมูลก่อน แล้วตอบเป็นข้อค้นพบพร้อมตัวเลข',\n      hello:['สวัสดีครับ ผมช่วยวิเคราะห์ข้อมูลร้านค้า\\n\\nมีคำถามอะไรที่อยากรู้จากข้อมูลครับ เช่น สินค้าไหนทำกำไรสุด และข้อมูลอยู่ที่ไหน (CSV / Google Sheets / แพลตฟอร์มร้านค้า)?'],\n      quick:['สินค้าไหนทำกำไรสุด', 'ลูกค้ากลุ่มไหนกลับมาซื้อซ้ำ', 'ยอดขายแยกตามช่องทาง'],\n      replies:['รับทราบครับ ผมจะตอบเป็น: ข้อค้นพบหลัก ตัวเลขประกอบ และข้อควรระวัง\\n\\n(โหมดเดโม ยังไม่มีข้อมูลจริง)', 'ได้ครับ ขอแหล่งข้อมูลและช่วงเวลาที่ต้องการวิเคราะห์ครับ']}\n  };\n  const PICKABLE = Object.keys(ROLES).filter(k => !ROLES[k].fixed);\n  const ROUTE = [\n    ['finance', /เงิน|กำไร|รายรับ|รายจ่าย|ภาษี|ต้นทุน|บัญชี/],\n    ['marketing', /โฆษณา|แคปชัน|แคมเปญ|คอนเทนต์|โปรโมชัน|การตลาด/],\n    ['legal', /กฎหมาย|pdpa|นโยบาย|สัญญา|ข้อกำหนด|คืนสินค้า/i],\n    ['market', /คู่แข่ง|เทรนด์|ตลาด|ราคา|อุตสาหกรรม/],\n    ['ops', /สต็อก|ออเดอร์|พัสดุ|จัดส่ง|สินค้าหมด/],\n    ['support', /ลูกค้า|ร้องเรียน|ไม่พอใจ|ตอบแชต/],\n    ['analyst', /วิเคราะห์|ข้อมูล|สถิติ|ซื้อซ้ำ/],\n    ['daily', /สรุป|วันนี้|เมื่อวาน|รายงาน/]\n  ];\n\n  /* ---------- state ---------- */\n  const mkBot = (team, role, color) => {\n    const R = ROLES[role];\n    return {id: uid(), name: R.name, role, color: color || R.color, team,\n      msgs: R.hello.map((t, i) => ({r:'bot', t, s: i === 0 ? stamp() : ''}))};\n  };\n  const mkSeed = () => {\n    const team = {id: uid(), name: 'ทีม 1', closed: false};\n    const bots = [mkBot(team.id, 'secretary'), ...PICKABLE.slice(0, 6).map(r => mkBot(team.id, r))];\n    return {teams:[team], bots, active: bots[0].id};\n  };\n  let S;\n  try { S = JSON.parse(localStorage.getItem(KEY)); } catch { S = null; }\n  const valid = s => s && Array.isArray(s.teams) && Array.isArray(s.bots) && s.bots.length && s.bots.every(b => ROLES[b.role] && typeof b.color === 'string');\n  if(!valid(S)) S = mkSeed();\n  // every team must have its Secretary\n  for(const t of S.teams) if(!S.bots.some(b => b.team === t.id && b.role === 'secretary')) S.bots.unshift(mkBot(t.id, 'secretary'));\n  if(!S.bots.some(b => b.id === S.active)) S.active = S.bots[0].id;\n  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };\n\n  /* ---------- 3D avatar service (snapshots of the ant, rendered in a hidden iframe) ---------- */\n  const AV = {ready:false, busy:null, queue:[], cache:{}};\n  try { AV.cache = JSON.parse(localStorage.getItem(AVKEY)) || {}; } catch {}\n  const avKey = (style, color) => style + '|' + color.toUpperCase();\n  const avSave = () => { try { const ks = Object.keys(AV.cache); if(ks.length > 40) ks.slice(0, ks.length - 40).forEach(k => delete AV.cache[k]); localStorage.setItem(AVKEY, JSON.stringify(AV.cache)); } catch {} };\n  function avPump(){\n    if(!AV.ready || AV.busy || !AV.queue.length) return;\n    const k = AV.queue.shift(); if(AV.cache[k]) return avPump();\n    AV.busy = k; const i = k.indexOf('|'), style = k.slice(0, i), color = k.slice(i + 1);\n    const f = $('#avsvc'); if(f && f.contentWindow) f.contentWindow.postMessage({type:'ant:render', id:k, style, color}, '*');\n    setTimeout(() => { if(AV.busy === k){ AV.busy = null; avPump(); } }, 6000);\n  }\n  function avRequest(k){ if(!AV.cache[k] && AV.busy !== k && !AV.queue.includes(k)){ AV.queue.push(k); avPump(); } }\n  function avApply(k){\n    const url = AV.cache[k]; if(!url) return;\n    document.querySelectorAll('.av').forEach(el => { if(el.dataset.k !== k) return; const img = el.querySelector('img'); if(img){ img.src = url; el.classList.add('has-img'); } });\n  }\n  window.addEventListener('message', e => {\n    const f = $('#avsvc'); if(!f || e.source !== f.contentWindow || !e.data) return;\n    if(e.data.type === 'ant:ready'){ AV.ready = true; avPump(); }\n    if(e.data.type === 'ant:rendered' && typeof e.data.url === 'string'){ AV.cache[e.data.id] = e.data.url; avSave(); if(AV.busy === e.data.id) AV.busy = null; avApply(e.data.id); avPump(); }\n  });\n  const faceSvg = '<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><ellipse cx=\"8.5\" cy=\"11\" rx=\"1.6\" ry=\"2.1\" fill=\"#fff\"/><ellipse cx=\"15.5\" cy=\"11\" rx=\"1.6\" ry=\"2.1\" fill=\"#fff\"/><path d=\"M10 15.2c.8.8 3.2.8 4 0\" stroke=\"#fff\" stroke-width=\"1.6\" stroke-linecap=\"round\" fill=\"none\"/><\/svg>';\n  function avatar(b, cls = '', id = ''){\n    const k = avKey(ROLES[b.role].style, b.color); const has = !!AV.cache[k];\n    if(!has) avRequest(k);\n    return `<span ${id ? `id=\"${id}\" ` : ''}class=\"av ${cls}${has ? ' has-img' : ''}\" data-k=\"${k}\" style=\"--c:${b.color}\"><img alt=\"\" ${has ? `src=\"${AV.cache[k]}\"` : ''}>${faceSvg}<\/span>`;\n  }\n\n  const ico = {\n    chev:'<svg class=\"i caret\" viewBox=\"0 0 24 24\"><path d=\"m6 9 6 6 6-6\"/><\/svg>',\n    plus:'<svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M12 5v14M5 12h14\"/><\/svg>',\n    pen:'<svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M12 20h9\"/><path d=\"M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z\"/><\/svg>',\n    trash:'<svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6\"/><\/svg>',\n    send:'<svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M12 19V5M5 12l7-7 7 7\"/><\/svg>',\n    back:'<svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"m15 18-6-6 6-6\"/><\/svg>',\n    dots:'<svg class=\"i\" viewBox=\"0 0 24 24\"><circle cx=\"5\" cy=\"12\" r=\"1.2\"/><circle cx=\"12\" cy=\"12\" r=\"1.2\"/><circle cx=\"19\" cy=\"12\" r=\"1.2\"/><\/svg>',\n    user:'<svg class=\"i\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"8\" r=\"4\"/><path d=\"M4 21c1-4 4-6 8-6s7 2 8 6\"/><\/svg>'\n  };\n  const esc = s => String(s).replace(/[&<>\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\n  const active = () => S.bots.find(b => b.id === S.active) || null;\n  const lastText = b => { const m = b.msgs[b.msgs.length - 1]; return m ? m.t.replace(/\\s+/g, ' ') : ''; };\n  const chipHTML = b => `<span class=\"chip${b.role === 'secretary' ? ' sec' : ''}\">${esc(ROLES[b.role].chip)}<\/span>`;\n  const teamBots = tid => S.bots.filter(b => b.team === tid);\n\n  /* ---------- sidebar ---------- */\n  let filter = '';\n  function renderSide(){\n    const q = filter.trim().toLowerCase();\n    const el = $('#groups'); el.innerHTML = '';\n    let shown = 0;\n    for(const g of S.teams){\n      const bots = teamBots(g.id).filter(b => !q || (b.name + ' ' + ROLES[b.role].chip).toLowerCase().includes(q))\n        .sort((a, b) => (b.role === 'secretary') - (a.role === 'secretary'));\n      if(q && !bots.length) continue;\n      shown += bots.length;\n      const wrap = document.createElement('section');\n      wrap.className = 'group' + (g.closed && !q ? ' closed' : '');\n      wrap.innerHTML = `<div class=\"group-head\">\n        <button class=\"gname\" aria-expanded=\"${!g.closed}\">${ico.chev}<span>${esc(g.name)}<\/span><span style=\"font-weight:400\">· ${bots.length}<\/span><\/button>\n        <button class=\"mini\" data-act=\"rename\" aria-label=\"เปลี่ยนชื่อทีม ${esc(g.name)}\">${ico.pen}<\/button>\n        <button class=\"mini\" data-act=\"add\" aria-label=\"เพิ่มพนักงานในทีม ${esc(g.name)}\">${ico.plus}<\/button>\n      <\/div><div class=\"bots\"><\/div>`;\n      const list = wrap.querySelector('.bots');\n      for(const b of bots){\n        const btn = document.createElement('button');\n        btn.className = 'bot'; btn.setAttribute('aria-current', String(b.id === S.active));\n        btn.innerHTML = `${avatar(b)}<span style=\"min-width:0\"><span class=\"nm\"><b>${esc(b.name)}<\/b>${chipHTML(b)}<\/span><span class=\"pv\" style=\"display:block\">${esc(lastText(b))}<\/span><\/span>`;\n        btn.onclick = () => { S.active = b.id; save(); renderSide(); renderChat(); $('#app').dataset.view = 'chat'; };\n        list.appendChild(btn);\n      }\n      wrap.querySelector('.gname').onclick = () => { g.closed = !g.closed; save(); renderSide(); };\n      wrap.querySelector('[data-act=\"add\"]').onclick = () => openDialog(g.id);\n      wrap.querySelector('[data-act=\"rename\"]').onclick = () => {\n        const head = wrap.querySelector('.group-head');\n        const inp = document.createElement('input'); inp.value = g.name; inp.maxLength = 30; inp.setAttribute('aria-label', 'ชื่อทีม');\n        head.replaceChildren(inp); inp.focus(); inp.select();\n        let done = false;\n        const fin = ok => { if(done) return; done = true; if(ok && inp.value.trim()) g.name = inp.value.trim(); save(); renderSide(); };\n        inp.onkeydown = e => { if(e.key === 'Enter') fin(true); if(e.key === 'Escape') fin(false); };\n        inp.onblur = () => fin(true);\n      };\n      el.appendChild(wrap);\n    }\n    if(!shown && q){ const d = document.createElement('div'); d.className = 'empty'; d.textContent = 'ไม่พบรายการที่ตรงกับคำค้น'; el.appendChild(d); }\n    const nt = document.createElement('button'); nt.className = 'new-team';\n    nt.innerHTML = `${ico.plus}<span>สร้างทีมใหม่ (มี Secretary ให้อัตโนมัติ)<\/span>`;\n    nt.onclick = () => {\n      const g = {id: uid(), name: 'ทีม ' + (S.teams.length + 1), closed: false};\n      S.teams.push(g); S.bots.push(mkBot(g.id, 'secretary')); save(); renderSide();\n    };\n    el.appendChild(nt);\n    placeLive();\n  }\n\n  /* ---------- live 3D profile: the active employee's avatar (header + sidebar) watches the composer and works ----------\n     The frames are created once (warmed during boot) and switched with a message, so picking someone never reloads a model.\n     Until the live model confirms, the cached snapshot underneath stays visible. */\n  let liveState = 'idle';\n  const LIVE = {head:{el:$('#live-head'), key:'', built:false}, side:{el:$('#live-side'), key:'', built:false}};\n  const PF = {key:'', built:false};\n  const frameOf = L => L.el.querySelector('iframe');\n  const liveUrl = (b, look) => 'ant-mascot.html?av=1&look=' + look + '&role=' + encodeURIComponent(b.role) + '&style=' + encodeURIComponent(ROLES[b.role].style) + '&color=' + encodeURIComponent(b.color);\n  function livePost(){\n    const b = active(); if(!b) return;\n    for(const k of ['head', 'side']){\n      const f = frameOf(LIVE[k]);\n      if(f && f.contentWindow && LIVE[k].built) try { f.contentWindow.postMessage({type:'ant:state', state: liveState, role: b.role}, '*'); } catch {}\n    }\n  }\n  function applyLive(L, b, look){\n    const key = [ROLES[b.role].style, b.color.toUpperCase(), b.role].join('|');\n    if(L.key === key) return;\n    const f = frameOf(L); L.el.classList.remove('ready');\n    if(!L.key || !L.built){ L.built = false; f.src = liveUrl(b, look); }\n    else f.contentWindow.postMessage({type:'ant:config', style: ROLES[b.role].style, color: b.color, role: b.role, key}, '*');\n    L.key = key;\n  }\n  function warmLive(){\n    const b = active(); if(!b) return;\n    applyLive(LIVE.head, b, 'down'); applyLive(LIVE.side, b, 'diag');\n    const f = $('#pf-frame');\n    if(!PF.key){ PF.key = ROLES[b.role].style + '|' + b.color.toUpperCase(); f.src = 'ant-mascot.html?style=' + encodeURIComponent(ROLES[b.role].style) + '&color=' + encodeURIComponent(b.color); }\n  }\n  window.addEventListener('message', e => {\n    const d = e.data; if(!d) return;\n    for(const k of ['head', 'side']){\n      const L = LIVE[k], f = frameOf(L);\n      if(!f || e.source !== f.contentWindow) continue;\n      if(d.type === 'ant:built' && !L.built){ L.built = true; L.el.classList.add('ready'); const b = active(); if(b){ const key = [ROLES[b.role].style, b.color.toUpperCase(), b.role].join('|'); if(key !== L.key){ L.key = ''; applyLive(L, b, k === 'head' ? 'down' : 'diag'); } } livePost(); }\n      if(d.type === 'ant:configured' && d.key === L.key){ L.el.classList.add('ready'); livePost(); }\n    }\n    const pf = $('#pf-frame');\n    if(pf && e.source === pf.contentWindow && d.type === 'ant:built') PF.built = true;\n  });\n  function placeLive(){\n    const b = active(), ar = $('#app').getBoundingClientRect(), gl = $('#groups').getBoundingClientRect();\n    const put = (L, target, look, clip) => {\n      const el = L.el, r = target ? target.getBoundingClientRect() : null;\n      let ok = !!(b && r && r.width > 8 && r.height > 8);\n      if(ok && clip) ok = r.top >= clip.top - 1 && r.bottom <= clip.bottom + 1;\n      if(b) applyLive(L, b, look);\n      if(!ok){ el.hidden = true; return; }\n      el.hidden = false;\n      el.style.left = (r.left - ar.left) + 'px'; el.style.top = (r.top - ar.top) + 'px';\n      el.style.width = r.width + 'px'; el.style.height = r.height + 'px'; el.style.setProperty('--c', b.color);\n      const f = frameOf(L), px = Math.round(r.width*2);\n      f.style.width = px + 'px'; f.style.height = px + 'px'; f.style.transform = 'scale(.5)';\n    };\n    put(LIVE.head, document.querySelector('#chat .pill .av'), 'down', null);\n    put(LIVE.side, document.querySelector('.bot[aria-current=\"true\"] .av'), 'diag', gl);\n  }\n  const syncDock = placeLive;\n  function setDock(st){ liveState = st; livePost(); }\n  addEventListener('resize', placeLive);\n  $('#groups').addEventListener('scroll', placeLive, {passive:true});\n\n  /* ---------- chat ---------- */\n  let typingFor = null;\n  function renderChat(){\n    const c = $('#chat'); const b = active();\n    const hadFocus = !!(document.activeElement && document.activeElement.id === 'msg');\n    if(!b){ c.innerHTML = '<div class=\"blank\">เลือกพนักงานจากรายการทางซ้าย หรือเพิ่มพนักงานใหม่<\/div>'; return; }\n    const R = ROLES[b.role];\n    c.innerHTML = `\n      <div class=\"chat-top\">\n        <button class=\"icon-btn back\" id=\"btn-back\" aria-label=\"กลับไปรายชื่อ\" style=\"background:var(--surf);border:1px solid var(--line)\">${ico.back}<\/button>\n        <button class=\"pill\" id=\"btn-prof\" aria-label=\"เปิดโปรไฟล์ ${esc(b.name)}\">${avatar(b, 'lg')}<span>${esc(b.name)}<\/span><\/button>\n        <div style=\"position:relative\">\n          <button class=\"more\" id=\"btn-more\" aria-label=\"ตัวเลือก\" aria-expanded=\"false\">${ico.dots}<\/button>\n          <div class=\"menu\" id=\"menu\">\n            <button id=\"m-prof\">${ico.user}<span>โปรไฟล์และสี<\/span><\/button>\n            <button id=\"m-rename\">${ico.pen}<span>เปลี่ยนชื่อ<\/span><\/button>\n            <button id=\"m-clear\">${ico.trash}<span>ล้างบทสนทนา<\/span><\/button>\n            ${b.role === 'secretary' ? '' : `<button id=\"m-del\" class=\"del\">${ico.trash}<span>ลบพนักงานนี้<\/span><\/button>`}\n          <\/div>\n        <\/div>\n      <\/div>\n      <div class=\"scroll\" id=\"scroll\"><div class=\"thread\" id=\"thread\"><\/div><\/div>\n      <div class=\"composer-wrap\">\n        <div class=\"composer\">\n          <div class=\"quick\" id=\"quick\"><h4>คำสั่งด่วน<\/h4><\/div>\n          <button class=\"icon-btn\" id=\"btn-quick\" aria-label=\"คำสั่งด่วน\" aria-expanded=\"false\" style=\"background:var(--surf-2)\">${ico.plus}<\/button>\n          <textarea id=\"msg\" rows=\"1\" placeholder=\"ส่งข้อความถึง ${esc(b.name)}\" aria-label=\"ข้อความ\"><\/textarea>\n          <button class=\"send\" id=\"send\" aria-label=\"ส่ง\" disabled>${ico.send}<\/button>\n        <\/div>\n        <div class=\"ws-note\">โหมดเดโม คำตอบเป็นตัวอย่างและยังไม่ได้เชื่อมข้อมูลร้านค้า<\/div>\n      <\/div>`;\n    const th = $('#thread');\n    let lastStamp = '';\n    for(const m of b.msgs){\n      if(m.s && m.s !== lastStamp){ const s = document.createElement('div'); s.className = 'stamp'; s.textContent = m.s; th.appendChild(s); lastStamp = m.s; }\n      const row = document.createElement('div'); row.className = 'row' + (m.r === 'me' ? ' me' : '');\n      const d = document.createElement('div'); d.className = 'msg'; d.textContent = m.t; row.appendChild(d);\n      if(m.link){\n        const tb = S.bots.find(x => x.id === m.link);\n        if(tb){ const h = document.createElement('button'); h.className = 'handoff'; h.innerHTML = avatar(tb, 'lg') + '<span>เปิดแชตกับ ' + esc(tb.name) + '<\/span>';\n          h.onclick = () => { S.active = tb.id; save(); renderSide(); renderChat(); }; row.appendChild(h); }\n      }\n      th.appendChild(row);\n    }\n    if(typingFor === b.id) addTyping();\n    const sc = $('#scroll'); sc.scrollTop = sc.scrollHeight;\n\n    $('#btn-back').onclick = () => { $('#app').dataset.view = 'list'; };\n    $('#btn-prof').onclick = () => openProfile(b.id);\n    const menu = $('#menu'), more = $('#btn-more');\n    more.onclick = e => { e.stopPropagation(); const on = menu.classList.toggle('on'); more.setAttribute('aria-expanded', on); };\n    $('#m-prof').onclick = () => openProfile(b.id);\n    $('#m-rename').onclick = () => { const n = prompt('ชื่อพนักงาน', b.name); if(n && n.trim()){ b.name = n.trim(); save(); renderSide(); renderChat(); } };\n    $('#m-clear').onclick = () => { b.msgs = b.msgs.slice(0, 1); save(); renderSide(); renderChat(); };\n    const del = $('#m-del');\n    if(del) del.onclick = () => {\n      if(!confirm('ลบ ' + b.name + ' ?')) return;\n      S.bots = S.bots.filter(x => x.id !== b.id); S.active = (teamBots(b.team)[0] || S.bots[0]).id; save(); renderSide(); renderChat();\n    };\n    const q = $('#quick'), qb = $('#btn-quick');\n    for(const t of R.quick){\n      const x = document.createElement('button'); x.textContent = t; x.onclick = () => { q.classList.remove('on'); qb.setAttribute('aria-expanded', 'false'); send(t); }; q.appendChild(x);\n    }\n    qb.onclick = e => { e.stopPropagation(); const on = q.classList.toggle('on'); qb.setAttribute('aria-expanded', on); };\n    const ta = $('#msg'), sb = $('#send');\n    const fit = () => { ta.style.height = '44px'; ta.style.height = Math.min(140, ta.scrollHeight) + 'px'; sb.disabled = !ta.value.trim(); };\n    ta.oninput = fit;\n    ta.onkeydown = e => { if(e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); if(ta.value.trim()) send(ta.value); } };\n    sb.onclick = () => { if(ta.value.trim()) send(ta.value); };\n    ta.addEventListener('focus', () => { if(typingFor !== b.id) setDock('typing'); });\n    ta.addEventListener('input', () => { if(typingFor !== b.id) setDock('typing'); });\n    ta.addEventListener('blur', () => { setTimeout(() => { if(document.activeElement !== $('#msg') && typingFor !== active()?.id) setDock('idle'); }, 120); });\n    if(hadFocus) ta.focus();\n    syncDock();\n    setDock(typingFor === b.id ? 'think' : (hadFocus ? 'typing' : 'idle'));\n  }\n  function addTyping(){ const t = document.createElement('div'); t.className = 'msg typing'; t.innerHTML = '<i><\/i><i><\/i><i><\/i>'; $('#thread').appendChild(t); }\n  function composeReply(b, text){\n    if(b.role === 'secretary'){\n      for(const [role, re] of ROUTE){\n        if(!re.test(text)) continue;\n        const target = teamBots(b.team).find(x => x.role === role);\n        if(target) return {t: `เรื่องนี้เหมาะกับ ${target.name} ครับ ผมส่งต่อให้แล้ว กดปุ่มด้านล่างเพื่อไปคุยต่อได้เลย`, link: target.id};\n        return {t: `เรื่องนี้เป็นงานของ ${ROLES[role].name} ซึ่งทีมนี้ยังไม่มี กด + เพื่อเพิ่มพนักงานด้านนี้เข้าทีมได้เลยครับ`};\n      }\n      return {t: 'รับเรื่องไว้แล้วครับ ขอรายละเอียดเพิ่มอีกนิดว่าเกี่ยวกับการเงิน การตลาด กฎหมาย ตลาด หรือสต็อก ผมจะได้เลือก Agent ที่เหมาะสมให้'};\n    }\n    const rs = ROLES[b.role].replies || [];\n    return {t: rs[b.msgs.length % Math.max(1, rs.length)] || 'รับทราบครับ'};\n  }\n  function send(text){\n    const b = active(); if(!b || typingFor) return;\n    b.msgs.push({r:'me', t: text.trim(), s: stamp()}); typingFor = b.id; save(); renderSide(); renderChat(); setDock('think');\n    const rep = composeReply(b, text);\n    setTimeout(() => {\n      b.msgs.push({r:'bot', t: rep.t, link: rep.link, s: stamp()}); typingFor = null; save(); renderSide();\n      if(active() && active().id === b.id) renderChat();\n      else setDock('idle');\n    }, 1900 + Math.random() * 600);\n  }\n  document.addEventListener('click', () => {\n    document.querySelectorAll('.menu.on,.quick.on').forEach(x => x.classList.remove('on'));\n  });\n\n  /* ---------- search ---------- */\n  $('#btn-search').onclick = () => {\n    const s = $('#search'), on = s.classList.toggle('on');\n    $('#btn-search').setAttribute('aria-expanded', on);\n    if(on) $('#q').focus(); else { $('#q').value = ''; filter = ''; renderSide(); }\n  };\n  $('#q').oninput = e => { filter = e.target.value; renderSide(); };\n\n  /* ---------- colour picker (shared by create + profile) ---------- */\n  function colorPicker(root, current, onPick, group){\n    root.innerHTML = '';\n    const cur = current.toUpperCase();\n    SWATCHES.forEach((c, i) => {\n      const l = document.createElement('label');\n      l.innerHTML = `<input type=\"radio\" name=\"${group}\" value=\"${c}\" ${c === cur ? 'checked' : ''} aria-label=\"สี ${i + 1}\"><span class=\"sw\" style=\"--c:${c}\"><\/span>`;\n      l.querySelector('input').onchange = () => onPick(c);\n      root.appendChild(l);\n    });\n    const cc = document.createElement('label'); cc.className = 'custom-c';\n    cc.innerHTML = `<input type=\"color\" value=\"${cur.length === 7 ? cur : '#E2513F'}\" aria-label=\"เลือกสีเอง\"><span>เลือกเอง<\/span>`;\n    let t; cc.querySelector('input').oninput = e => { clearTimeout(t); const v = e.target.value; t = setTimeout(() => { root.querySelectorAll('input[type=radio]').forEach(r => r.checked = false); onPick(v.toUpperCase()); }, 250); };\n    root.appendChild(cc);\n  }\n\n  /* ---------- add employee: the role is a fixed choice, each with its own conversation pattern ---------- */\n  const dlg = $('#dlg');\n  let draft = null;\n  function drawPreview(){\n    const R = ROLES[draft.role];\n    $('#f-prev').outerHTML = avatar({role: draft.role, color: draft.color}, 'xl', 'f-prev');\n    $('#f-pat').innerHTML = `<b>${esc(R.name)}<\/b>${esc(R.pattern)}`;\n    $('#f-name').placeholder = R.name;\n  }\n  function openDialog(teamId){\n    const first = PICKABLE[0];\n    draft = {role: first, color: ROLES[first].color};\n    $('#f-err').textContent = ''; $('#f-name').value = '';\n    $('#f-role').innerHTML = PICKABLE.map(k => `<option value=\"${k}\">${esc(ROLES[k].name)} · ${esc(ROLES[k].label)}<\/option>`).join('');\n    $('#f-team').innerHTML = S.teams.map(g => `<option value=\"${g.id}\">${esc(g.name)}<\/option>`).join('');\n    $('#f-team').value = teamId || S.teams[0].id;\n    const paint = () => colorPicker($('#f-colors'), draft.color, c => { draft.color = c; drawPreview(); }, 'newcolor');\n    $('#f-role').onchange = e => { draft.role = e.target.value; draft.color = ROLES[draft.role].color; paint(); drawPreview(); };\n    paint(); drawPreview();\n    dlg.showModal();\n  }\n  $('#btn-new').onclick = () => openDialog();\n  $('#f-cancel').onclick = () => dlg.close();\n  $('#form').addEventListener('submit', () => {\n    const b = mkBot($('#f-team').value, draft.role, draft.color);\n    const nm = $('#f-name').value.trim(); if(nm) b.name = nm;\n    S.bots.push(b); S.active = b.id; save(); renderSide(); renderChat(); $('#app').dataset.view = 'chat';\n  });\n\n  /* ---------- 3D profile (live ant model; colour changes apply to the model and every avatar) ---------- */\n  const pf = $('#pf');\n  function loadPfFrame(b){\n    const f = $('#pf-frame'), key = ROLES[b.role].style + '|' + b.color.toUpperCase();\n    if(!PF.key){ PF.key = key; PF.built = false; f.src = 'ant-mascot.html?style=' + encodeURIComponent(ROLES[b.role].style) + '&color=' + encodeURIComponent(b.color); }\n    else if(PF.key !== key){\n      PF.key = key;\n      if(PF.built && f.contentWindow) f.contentWindow.postMessage({type:'ant:config', style: ROLES[b.role].style, color: b.color, role: b.role, key}, '*');\n      else { PF.built = false; f.src = 'ant-mascot.html?style=' + encodeURIComponent(ROLES[b.role].style) + '&color=' + encodeURIComponent(b.color); }\n    }\n  }\n  function openProfile(id){\n    const b = S.bots.find(x => x.id === id); if(!b) return;\n    const R = ROLES[b.role];\n    $('#pf-name').innerHTML = `<span>${esc(b.name)}<\/span>${chipHTML(b)}`;\n    $('#pf-pat').innerHTML = `<b>รูปแบบการเริ่มคุย<\/b>${esc(R.pattern)}`;\n    colorPicker($('#pf-colors'), b.color, c => { b.color = c; save(); loadPfFrame(b); renderSide(); renderChat(); }, 'pfcolor');\n    loadPfFrame(b);\n    pf.showModal();\n  }\n  $('#pf-close').onclick = () => pf.close();\n  pf.addEventListener('click', e => { if(e.target === pf) pf.close(); });\n\n  /* preload hooks used by the landing page's boot loader */\n  window.SoloraWS = {\n    start(){ const f = $('#avsvc'); if(f && !f.getAttribute('src') && f.dataset.src) f.src = f.dataset.src; warmLive(); },\n    progress(){\n      const keys = new Set(S.bots.map(b => avKey(ROLES[b.role].style, b.color)));\n      let done = 0; keys.forEach(k => { if(AV.cache[k]) done++; });\n      done += (LIVE.head.built ? 1 : 0) + (LIVE.side.built ? 1 : 0) + (PF.built ? 1 : 0);\n      return {done, total: keys.size + 3};\n    }\n  };\n\n  renderSide(); renderChat();\n  if(!$('#avsvc').dataset.src) warmLive();\n  if(matchMedia('(min-width:821px)').matches) $('#app').dataset.view = 'chat';\n})();\n\n<\/script>\n<script>\n(function(){var r=function(){var on=location.hash==='#app';document.documentElement.classList.toggle('ws-on',on);if(on)window.scrollTo(0,0)};addEventListener('hashchange',r);r();})();\n(function(){\n  var B = window.__boot; if(!B) return;\n  var t0 = Date.now(), hero = false, ready = false;\n  var WS = function(){ return window.SoloraWS || {progress:function(){return {done:0,total:1}}, start:function(){}}; };\n  var inApp = function(){ return location.hash === '#app'; };\n  function startPreload(){ if(hero) return; hero = true; B.set(70); WS().start(); }\n  addEventListener('message', function(e){\n    if(!e.data || e.data.type !== 'ant:shown') return;\n    var f = document.querySelector('.hero-ant iframe');\n    if(f && e.source === f.contentWindow) startPreload();\n  });\n  B.set(45, 'Loading Solora...');\n  function tick(){\n    var age = Date.now() - t0;\n    if(!hero && age > 25000) startPreload();\n    var p = WS().progress(), frac = p.total ? p.done/p.total : 0;\n    if(hero){ B.set(70 + 30*frac); if(p.total && p.done >= p.total) ready = true; }\n    if(inApp() && age > 70000) ready = true;\n    if(inApp()){\n      if(hero && ready) B.hide(); else B.show('Preparing for your team...');\n    } else if(hero){\n      B.hide();\n    }\n  }\n  setInterval(tick, 250); tick();\n})();\n<\/script>\n<\/body><\/html>"
  </script>
