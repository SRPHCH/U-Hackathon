  <title>Bundled Page</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }

    #__bundler_placeholder { color: #999; font-size: 14px; }

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is

<section id=\"agents\" class=\"sec\" style=\"padding-top:40px\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\" style=\"grid-template-columns:minmax(0,1fr)\">\n      <h2>เป็น Solo Entrepreneur<br>แต่มีทีมครบทุกฝ่าย<\/h2>\n    <\/div>\n    <div class=\"agents\">\n      <sc-for list=\"{{ agents }}\" as=\"a\" hint-placeholder-count=\"6\">\n        <article class=\"agent\">\n          <div>\n            <div class=\"agent-name\"><h3 style=\"font:inherit\">{{ a.name }}<\/h3><\/div>\n            <div class=\"agent-role\">{{ a.role }}<\/div>\n          <\/div>\n          <ul>\n            <sc-for list=\"{{ a.tasks }}\" as=\"t\" hint-placeholder-count=\"3\">\n              <li><span>{{ t }}<\/span><\/li>\n            <\/sc-for>\n          <\/ul>\n        <\/article>\n      <\/sc-for>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ADVISOR -->\n<section id=\"advisor\" class=\"sec advisor\">\n  <div class=\"wrap\"><div class=\"advisor-shell\"><div class=\"advisor-grid\">\n    <div>\n      <h2>มี Secretary เลือก Agent ให้ ไม่ต้องนั่งเลือกเอง<\/h2>\n      <p style=\"margin-top:20px;font-size:17px;line-height:1.8;color:var(--ink-2);text-wrap:pretty\">Secretary วิเคราะห์ประเภทสินค้า ช่องทางขาย และแนวทางการทำธุรกิจของคุณ แล้วเรียกใช้ AI Agent ด้านที่เหมาะสมให้ ช่วยบริหารจัดการ Token ได้อย่างคุ้มค่า และกำหนดว่า Agent ตัวไหนควรส่งข้อมูลต่อกัน<\/p>\n      <dl class=\"points\">\n        <sc-for list=\"{{ advisorPoints }}\" as=\"p\" hint-placeholder-count=\"3\">\n          <div><dt>{{ p.t }}<\/dt><dd>{{ p.d }}<\/dd><\/div>\n        <\/sc-for>\n      <\/dl>\n    <\/div>\n    <div class=\"map\">\n      <h3>แผนผังการเชื่อม Agent · {{ cur.label }}<\/h3>\n      <ul class=\"map-list\">\n        <sc-for list=\"{{ nodeGrid }}\" as=\"nd\" hint-placeholder-count=\"6\">\n          <li class=\"map-row\" data-in=\"{{ nd.inChain }}\">\n            <span>{{ nd.name }}<\/span>\n            <span class=\"data\" style=\"text-align:right\">{{ nd.pct }}%<\/span>\n            <span class=\"step data\">{{ nd.step }}<\/span>\n          <\/li>\n        <\/sc-for>\n      <\/ul>\n      <p class=\"map-foot\"><b>ลำดับที่แนะนำ: <\/b>{{ chainText }}<\/p>\n    <\/div>\n  <\/div><\/div><\/div>\n<\/section>\n\n<!-- ORACLE -->\n<section id=\"oracle\" class=\"sec oracle\" style=\"padding-top:0\">\n  <div class=\"wrap\"><div class=\"oracle-shell\">\n    <h2>ช่วยประเมินแนวทางการเติบโตของตลาดคุณ<\/h2>\n    <p class=\"lede2\">Market & Industry Update ค้นหาและดึงข้อมูลในปัจจุบันรวมถึงอดีตที่ผ่านมา คัดเฉพาะที่เกี่ยวกับธุรกิจของคุณ ย่อยและสรุปผล แล้วทำนายว่าแนวโน้มในตลาดจะไปในทิศทางไหน พร้อมแนวทางที่ควรทำต่อ<\/p>\n\n    <ol class=\"steps\">\n      <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"5\">\n        <li>\n          <div class=\"n data\">{{ s.n }}<\/div>\n          <div class=\"t\">{{ s.t }}<\/div>\n          <div class=\"d\">{{ s.d }}<\/div>\n        <\/li>\n      <\/sc-for>\n    <\/ol>\n\n    <div class=\"forecast\">\n      <div class=\"fc\">\n        <div class=\"fc-head\">\n          <div>\n            <div class=\"fc-label\">คาดการณ์ 90 วันข้างหน้า<\/div>\n            <div class=\"fc-trend\">{{ cur.trend }}<\/div>\n          <\/div>\n          <div class=\"fc-num num\">{{ cur.forecast }}<\/div>\n        <\/div>\n        <svg sc-camel-view-box=\"0 0 600 220\" role=\"img\" aria-label=\"กราฟข้อมูลย้อนหลัง 24 เดือนและช่วงคาดการณ์\">\n          <line x1=\"0\" y1=\"55\" x2=\"600\" y2=\"55\" stroke=\"oklch(0.92 0.014 355)\"><\/line>\n          <line x1=\"0\" y1=\"110\" x2=\"600\" y2=\"110\" stroke=\"oklch(0.92 0.014 355)\"><\/line>\n          <line x1=\"0\" y1=\"165\" x2=\"600\" y2=\"165\" stroke=\"oklch(0.92 0.014 355)\"><\/line>\n          <polygon points=\"380,118 430,92 480,80 530,56 600,34 600,96 530,110 480,124 430,128 380,118\" fill=\"oklch(0.865 0.085 358 / .45)\"><\/polygon>\n          <polyline points=\"0,170 40,160 80,166 120,148 160,152 200,138 240,144 280,126 320,132 380,118\" fill=\"none\" stroke=\"oklch(0.3 0.03 350)\" stroke-width=\"2.5\" stroke-linejoin=\"round\"><\/polyline>\n          <polyline points=\"380,118 430,110 480,102 530,84 600,66\" fill=\"none\" stroke=\"oklch(0.6 0.19 356)\" stroke-width=\"2.5\" stroke-dasharray=\"7 6\" stroke-linejoin=\"round\"><\/polyline>\n          <line x1=\"380\" y1=\"10\" x2=\"380\" y2=\"210\" stroke=\"oklch(0.82 0.04 355)\"><\/line>\n          <circle cx=\"380\" cy=\"118\" r=\"5\" fill=\"oklch(0.6 0.19 356)\"><\/circle>\n        <\/svg>\n        <div class=\"fc-axis\"><span>ข้อมูลย้อนหลัง 24 เดือน<\/span><span>วันนี้<\/span><span>คาดการณ์<\/span><\/div>\n      <\/div>\n      <div class=\"recs\">\n        <h3>แนวทางที่แนะนำ<\/h3>\n        <ol>\n          <sc-for list=\"{{ recs }}\" as=\"r\" hint-placeholder-count=\"3\">\n            <li><span class=\"data\">{{ r.n }}<\/span><span>{{ r.t }}<\/span><\/li>\n          <\/sc-for>\n        <\/ol>\n        <p>ทุกคำทำนายแสดงแหล่งข้อมูลและระดับความมั่นใจ เพื่อให้คุณตัดสินใจเองได้<\/p>\n      <\/div>\n    <\/div>\n  <\/div><\/div>\n<\/section>\n\n<!-- PRICING -->\n<section id=\"pricing\" class=\"sec\">\n  <div class=\"wrap\">\n    <div class=\"pricing-head\">\n      <h2>จ่ายเท่าที่ธุรกิจคุณใช้<\/h2>\n      <div class=\"toggle\" role=\"group\" aria-label=\"รอบการเรียกเก็บเงิน\">\n        <button sc-camel-on-click=\"{{ setMonthly }}\" aria-pressed=\"{{ mOn }}\">รายเดือน<\/button>\n        <button sc-camel-on-click=\"{{ setYearly }}\" aria-pressed=\"{{ yOn }}\">รายปี <b>ถูกกว่า 0%<\/b><\/button>\n      <\/div>\n    <\/div>\n    <div class=\"plans plans-one\">\n      <sc-for list=\"{{ plans }}\" as=\"pl\" hint-placeholder-count=\"3\">\n        <div class=\"plan\" data-hot=\"{{ pl.hotS }}\">\n          <div class=\"plan-name\"><span>{{ pl.name }}<\/span>\n            <sc-if value=\"{{ pl.hot }}\" hint-placeholder-val=\"{{ false }}\"><small>แนะนำ<\/small><\/sc-if>\n          <\/div>\n          <div class=\"plan-desc\">{{ pl.desc }}<\/div>\n          <div class=\"price num\">฿{{ pl.price }}<small>/ เดือน<\/small><\/div>\n          <div class=\"bill\">{{ pl.billNote }}<\/div>\n          <a href=\"#app\" class=\"btn\">เริ่มทดลองใช้<\/a>\n          <ul class=\"feat\">\n            <sc-for list=\"{{ pl.features }}\" as=\"ft\" hint-placeholder-count=\"5\">\n              <li><svg width=\"14\" height=\"14\" viewBox=\"0 0 14 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\"><path d=\"M2 7.5l3.2 3L12 3.5\"><\/path><\/svg><span>{{ ft }}<\/span><\/li>\n            <\/sc-for>\n          <\/ul>\n        <\/div>\n      <\/sc-for>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- FAQ -->\n<section id=\"faq\" class=\"sec\" style=\"padding-top:24px\">\n  <div class=\"wrap faq-wrap\">\n    <h2 class=\"faq-title\">คำถามที่พบบ่อย<\/h2>\n    <div class=\"faqs\">\n      <sc-for list=\"{{ faqs }}\" as=\"q\" hint-placeholder-count=\"6\">\n        <div class=\"faq\" data-open=\"{{ q.on }}\">\n          <button sc-camel-on-click=\"{{ q.toggle }}\" aria-expanded=\"{{ q.on }}\">\n            <span>{{ q.q }}<\/span>\n            <span class=\"ic\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" aria-hidden=\"true\"><path d=\"M10 3v14M3 10h14\"><\/path><\/svg><\/span>\n          <\/button>\n          <div class=\"a\" style=\"grid-template-rows:{{ q.rows }}\">\n            <div><p>{{ q.a }}<\/p><\/div>\n          <\/div>\n        <\/div>\n      <\/sc-for>\n    <\/div>\n    <p class=\"faq-contact\">ไม่พบคำตอบที่ต้องการ? ติดต่อทีมงานได้ที่ <a class=\"u\" href=\"mailto:XXX@gmail.com\">XXX@gmail.com<\/a><\/p>\n  <\/div>\n<\/section>\n\n<!-- CTA -->\n<section class=\"cta-wrap\">\n  <div class=\"wrap\"><div class=\"cta\">\n    <h2>ให้ทีม AI ช่วยพาธุรกิจของคุณไปให้ถึงฝัน เริ่มได้ตั้งแต่ตอนนี้<\/h2>\n    <p>แค่สมัคร Plan ก็เริ่มใช้งานได้ทันที ไม่ต้องผูกกับร้านค้า<\/p>\n    <div class=\"cta-row\" style=\"margin-top:30px\">\n      <a href=\"#app\" class=\"btn\">เริ่มใช้งาน<\/a>\n    <\/div>\n  <\/div><\/div>\n<\/section>\n<\/main>\n\n<footer clas e: 'MI', name: 'Market & Industry Update', role: 'ข่าวตลาด คู่แข่ง และอุตสาหกรรม', status: 'ทำงานอยู่', tasks: ['ติดตามราคาและโปรโมชันของคู่แข่ง', 'สรุปข่าวอุตสาหกรรมที่กระทบสินค้าของคุณ', 'แจ้งเตือนสินค้าหรือเทรนด์ที่เริ่มมาแรง'] },\n  { code: 'DL', name: 'Daily Update', role: 'สรุปประจำวันในข้อความเดียว', status: 'ส่งทุก 08:00', tasks: ['รวมผลงานของทุก Agent เป็นสรุปสั้นๆ', 'จัดลำดับสิ่งที่ต้องตัดสินใจวันนี้', 'ส่งผ่านอีเมลหรือแอปแชตที่คุณใช้'] },\n  { code: 'OP', name: 'Operations Agent', role: 'สต็อก ออเดอร์ และการจัดส่ง', status: 'Agent เสริม', tasks: ['คาดการณ์สต็อกที่ใกล้หมดและเวลาสั่งเพิ่ม', 'ติดตามออเดอร์ที่ส่งล่าช้า', 'ตอบคำถามลูกค้าเรื่องสถานะพัสดุ'] }\n];\n\nclass Component extends DCLogic {\n  state = { ind: this.props.defaultIndustry ?? 'it', yearly: (this.props.defaultBilling ?? 'yearly') === 'yearly', open: 0, tick: 0 };\n\n  componentDidMount() {\n    this.timer = setInterval(() => this.setState(s => ({ tick: s.tick + 1 })), 3200);\n  }\n  componentWillUnmount() { clearInterval(this.timer); }\n\n  renderVals() {\n    const { ind, yearly, open, tick } = this.state;\n    const cur = { key: ind, ...IND[ind] };\n    const sorted = Object.entries(cur.mix).sort((a, b) => b[1] - a[1]);\n    const top = sorted[0][0];\n    const pink = 'oklch(0.84 0.09 358)', ink = 'oklch(0.22 0.02 330)';\n\n    const industries = Object.entries(IND).map(([k, v]) => {\n      const on = k === ind;\n      return { label: v.label, pick: () => this.setState({ ind: k }), on: on ? 'true' : 'false' };\n    });\n    const mixRows = sorted.map(([k, p], i) => ({ name: NAMES[k], pct: p, w: (p / sorted[0][1] * 100) + '%', top: i === 0 ? 'true' : 'false' }));\n    const chain = cur.chain.map((k, i) => ({ name: NAMES[k], arrow: i < cur.chain.length - 1 }));\n    const feed = [0, 1, 2, 3].map(i => {\n      const f = FEED[(tick + i) % FEED.length];\n      return { ...f, t: ['เพิ่งเสร็จ', '2 นาที', '9 นาที', '21 นาที'][i], o: 1 - i * 0.18 };\n    });\n    const order = ['market', 'oracle', ' <\/div>\n    <div class=\"side-foot\">\n      <div class=\"me\" aria-hidden=\"true\">SR<\/div>\n      <div class=\"ws-plan\"><b>Plan Demo<\/b>ทดลองใช้งาน<\/div>\n      <a class=\"home\" href=\"#top\">หน้าแรก<\/a>\n    <\/div>\n  <\/aside>\n\n  <main class=\"chat\" id=\"chat\" aria-label=\"แชต\"><\/main>\n  <main class=\"page\" id=\"page\" hidden><\/main>\n  <div class=\"live-av\" id=\"live-side\" hidden aria-hidden=\"true\"><iframe title=\"\" tabindex=\"-1\"><\/iframe><\/div>\n  <div class=\"live-av\" id=\"live-head\" hidden aria-hidden=\"true\"><iframe title=\"\" tabindex=\"-1\"><\/iframe><\/div>\n<\/div>\n\n<dialog id=\"dlg\">\n  <form class=\"dlg\" id=\"form\" method=\"dialog\">\n    <h3>เพิ่มพนักงาน AI<\/h3>\n    <label class=\"fld\">หน้าที่\n      <select id=\"f-role\"><\/select>\n    <\/label>\n    <div class=\"role-box\">\n      <span class=\"av xl\" id=\"f-prev\"><\/span>\n      <div class=\"pat\" id=\"f-pat\"><\/div>\n    <\/div>\n    <label class=\"fld\">ชื่อ (ไม่ใส่ก็ได้)<input type=\"text\" id=\"f-name\" maxlength=\"40\" placeholder=\"ใช้ชื่อตามหน้าที่\" autocomplete=\"off\"><\/label>\n    <div class=\"fld\">สี\n      <div class=\"swatches\" id=\"f-colors\"><\/div>\n    <\/div>\n    <label class=\"fld\">ทีม<select id=\"f-team\"><\/select><\/label>\n    <div class=\"err\" id=\"f-err\" role=\"alert\"><\/div>\n    <div class=\"dlg-actions\">\n      <button class=\"ws-btn\" type=\"button\" id=\"f-cancel\">ยกเลิก<\/button>\n      <button class=\"ws-btn primary\" type=\"submit\">เพิ่มพนักงาน<\/button>\n    <\/div>\n  <\/form>\n<\/dialog>\n\n<dialog id=\"pf\">\n  <div class=\"pf-3d\"><iframe id=\"pf-frame\" title=\"โมเดล 3D ของพนักงาน AI\"><\/iframe><\/div>\n  <div class=\"pf-body\">\n    <h3 id=\"pf-name\"><\/h3>\n    <div class=\"pf-pat\" id=\"pf-pat\"><\/div>\n    <div class=\"fld\"><span class=\"pf-sec\">สีประจำตัว<\/span>\n      <div class=\"swatches\" id=\"pf-colors\"><\/div>\n    <\/div>\n    <div class=\"dlg-actions\"><button class=\"ws-btn primary\" type=\"button\" id=\"pf-close\">ปิด<\/button><\/div>\n  <\/div>\n<\/dialog>\n\n<iframe id=\"avsvc\" data-src=\"ant-mascot.html?snap=1\" title=\"\" aria-hidden=\"true\" tabindex=\"-1\" style=\"position:absolute;width:1px;height:1px;border:0;opacity:0;pointer-events:none;left:-9px;top:-9px\"><\/iframe><\/div>\n<script>\n(() => {\n  const SWATCHES = ['#E2513F', '#FA70AB', '#DD6ADC', '#A25BFF', '#4778FF', '#00B1FF', '#04BB9F', '#B6D80B', '#FFCC38', '#FF8066'];\n  const KEY = 'solora.workspace.v2', AVKEY = 'solora.avatars.v1';\n  const $ = s => document.querySelector(s);\n  const uid = () => Math.random().toString(36).slice(2, 9);\n  const stamp = () => 'วันนี้ ' + new Date().toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit', hour12:false});\n\n  /* Each role = one look on the ant model (accessory style + default colour) and its own way of opening a conversation. */\n  const ROLES = {\n    secretary:{label:'Secretary', name:'Secretary', chip:'Secretary', style:'gentleman', color:'#E2513F', fixed:true,\n      pattern:'ถามก่อนว่าวันนี้ต้องการอะไร แล้วเลือกและส่งต่อให้ Agent ที่เหมาะสมในทีม คุณไม่ต้องเลือกเอง',\n      hello:['สวัสดีครับ ผมเป็น Secretary ประจำทีมนี้ ทุกเรื่องบอกผมได้เลย ผมจะเลือกและส่งต่อให้ Agent ที่เหมาะสมให้\\n\\nวันนี้อยากให้ช่วยเรื่องอะไรครับ?'],\n      quick:['สรุปว่าวันนี้มีอะไรต้องทำ', 'อยากรู้กำไรสัปดาห์นี้', 'ช่วยร่างแคปชันสินค้าใหม่']},\n    finance:{label:'การเงิน', name:'Finance Agent', chip:'การเงิน', style:'royal', color:'#FFCC38',\n      pattern:'เริ่มจากตัวเลข ถามช่วงเวลาและขอบเขตก่อน แล้วตอบเป็นข้อสั้นๆ',\n      hello:['สวัสดีครับ ผมดูแลตัวเลขการเงินของร้านคุณ\\n\\nขอถามก่อนเพื่อให้ตัวเลขตรงครับ: อยากดูช่วงไหน (สัปดาห์นี้ / เดือนนี้ / ไตรมาส) และเน้นเรื่องอะไร (กำไร / ค่าโฆษณา / กระแสเงินสด)?'],\n      quick:['สรุปรายรับรายจ่ายสัปดาห์นี้', 'ต้นทุนโฆษณาสูงผิดปกติไหม', 'เตรียมเอกสารภาษีรายเดือน'],\n      replies:['รับทราบครับ ผมจะสรุปเป็น 3 ข้อ: 1) รายรับ 2) รายจ่าย 3) กำไรสุทธิ\\n\\nตอนนี้เป็นโหมดเดโม ยังไม่มีตัวเลขจริง เมื่อเชื่อมร้านค้าแล้วผมจะใส่ให้ครับ', 'ได้ครับ ขอยืนยันช่วงเวลาอีกครั้งว่าเป็นสัปดาห์นี้ใช่ไหม ถ้าใช่ผมจะเทียบกับสัปดาห์ก่อนให้ด้วยครับ']},\n    marketing:{label:'การตลาด', name:'Marketing Agent', chip:'การตลาด', style:'artist', color:'#FA70AB',\n      pattern:'ถามเป้าหมายและกลุ่มลูกค้าก่อน แล้วเสนอทางเลือก 2–3 แบบให้เลือก',\n      hello:['สวัสดีครับ ผมช่วยคิดแคมเปญและคอนเทนต์\\n\\nเริ่มจากเป้าหมายก่อนนะครับ: อยากเพิ่มยอดขาย เพิ่มคนรู้จัก หรือดึงลูกค้าเก่ากลับมา และขายให้ใครเป็นหลัก?'],\n      quick:['ร่างแคปชันสินค้าใหม่', 'วางแผนแคมเปญ 11.11', 'วิเคราะห์ผลโฆษณาล่าสุด'],\n      replies:['เข้าใจแล้วครับ ผมมี 3 ทางให้เลือก: A) โปรโมชันลดราคา B) เล่าเรื่องแบรนด์ C) รีวิวจากลูกค้า อยากไปทางไหนก่อนครับ?\\n\\n(โหมดเดโม ยังไม่ใช้ข้อมูลร้านจริง)', 'ได้ครับ ขอกลุ่มลูกค้าหลักอีกนิดครับ แล้วผมจะร่างเวอร์ชันแรกให้เลือก 2 แบบ']},\n    legal:{label:'กฎหมาย', name:'Legal Agent', chip:'กฎหมาย', style:'scholar', color:'#4778FF',\n      pattern:'ระมัดระวัง ขอข้อความหรือเอกสารต้นฉบับก่อน และแจ้งข้อจำกัดให้ชัดเจน',\n      hello:['สวัสดีครับ ผมช่วยตรวจความเสี่ยงด้านกฎหมายเบื้องต้นให้ร้านค้า\\n\\nส่งข้อความโฆษณา นโยบาย หรือเอกสารที่อยากให้ตรวจมาได้เลยครับ ผมจะชี้จุดเสี่ยงและแนะนำวิธีแก้ ทั้งนี้เป็นข้อมูลเบื้องต้น ไม่ใช่คำปรึกษากฎหมายอย่างเป็นทางการ'],\n      quick:['ตรวจคำโฆษณาก่อนโพสต์', 'ร่างนโยบายคืนสินค้า', 'สรุปสิ่งที่ PDPA กำหนดกับร้านค้า'],\n      replies:['รับทราบครับ ผมต้องเห็นข้อความต้นฉบับเต็มก่อนจึงจะชี้จุดเสี่ยงได้ถูกต้อง ส่งมาได้เลยครับ\\n\\n(โหมดเดโม และเป็นข้อมูลเบื้องต้นเท่านั้น)', 'ได้ครับ ผมจะแยกเป็น: จุดที่เสี่ยง ระดับความเสี่ยง และวิธีแก้ที่แนะนำ']},\n    market:{label:'ตลาดและอุตสาหกรรม', name:'Market & Industry Update', chip:'ตลาด', style:'detective', color:'#04BB9F',\n      pattern:'ถามหมวดสินค้าและคู่แข่งก่อน แล้วสรุปพร้อมแหล่งข้อมูลและระดับความมั่นใจ',\n      hello:['สวัสดีครับ ผมติดตามตลาด คู่แข่ง และเทรนด์ให้\\n\\nบอกผมหน่อยครับ ร้านคุณขายสินค้าหมวดไหน และมีคู่แข่งรายไหนที่อยากให้จับตาเป็นพิเศษ?'],\n      quick:['คู่แข่งลดราคาอะไรบ้าง', 'เทรนด์ที่เริ่มมาแรงในหมวดของฉัน', 'คาดการณ์ความต้องการ 30 วันข้างหน้า'],\n      replies:['รับทราบครับ ผมจะสรุปเป็น: สิ่งที่เปลี่ยน แหล่งข้อมูล และระดับความมั่นใจ\\n\\n(โหมดเดโม ยังไม่ได้ดึงข้อมูลตลาดจริง)', 'ได้ครับ ขอหมวดสินค้ากับรายชื่อคู่แข่งหลักอีกนิด แล้วผมจะตั้งให้เฝ้าติดตามทุกวัน']},\n    daily:{label:'สรุปรายวัน', name:'Daily Update', chip:'สรุปรายวัน', style:'cool', color:'#00B1FF',\n      pattern:'สั้น เป็นข้อ เรียงตามสิ่งที่ต้องตัดสินใจก่อน',\n      hello:['อรุณสวัสดิ์ครับ ผมสรุปงานของทุก Agent ให้เป็นข้อสั้นๆ ทุกเช้า\\n\\nอยากรับสรุปเวลาไหน และทางช่องทางไหนครับ (อีเมล / แอปแชต)?'],\n      quick:['สรุปของเมื่อวาน', 'มีอะไรต้องตัดสินใจวันนี้', 'เปลี่ยนเวลารับสรุปเป็น 08:00'],\n      replies:['ตั้งไว้ให้แล้วครับ ทุกเช้าผมจะส่ง 3 ส่วน: ผลงานเมื่อวาน สิ่งที่ต้องตัดสินใจ และเรื่องที่ควรจับตา\\n\\n(โหมดเดโม)', 'ได้ครับ ขอเวลาที่ต้องการรับสรุปอีกครั้งครับ']},\n    ops:{label:'ปฏิบัติการ', name:'Operations Agent', chip:'ปฏิบัติการ', style:'athlete', color:'#FF8066',\n      pattern:'ถามเลขออเดอร์หรือรหัสสินค้า แล้วรายงานสถานะตรงๆ',\n      hello:['สวัสดีครับ ผมดูแลสต็อกและการจัดส่ง\\n\\nมีเลขออเดอร์หรือรหัสสินค้า (SKU) ที่อยากให้เช็กไหมครับ หรืออยากดูภาพรวมของที่ใกล้หมด?'],\n      quick:['สินค้าอะไรใกล้หมด', 'ออเดอร์ที่ส่งล่าช้า', 'สถานะพัสดุของลูกค้า'],\n      replies:['รับทราบครับ ขอเลขออเดอร์หรือ SKU เพื่อเช็กสถานะให้ตรงครับ\\n\\n(โหมดเดโม ยังไม่ได้เชื่อมระบบสต็อก)', 'ได้ครับ ผมจะรายงานเป็น: สถานะปัจจุบัน ที่ติดขัด และสิ่งที่ควรทำต่อ']},\n    support:{label:'ดูแลลูกค้า', name:'Customer Support Agent', chip:'ดูแลลูกค้า', style:'playful', color:'#A25BFF',\n      pattern:'ฟังปัญหาของลูกค้าก่อน ใช้น้ำเสียงอ่อนโยน แล้วค่อยเสนอทางแก้',\n      hello:['สวัสดีครับ ผมช่วยดูแลลูกค้าของร้านคุณ\\n\\nเล่าให้ฟังหน่อยครับว่าลูกค้ากำลังเจอปัญหาอะไร ผมจะช่วยร่างคำตอบที่สุภาพและตรงจุดให้'],\n      quick:['ร่างคำตอบลูกค้าที่ไม่พอใจ', 'ตอบเรื่องขอคืนสินค้า', 'สรุปคำถามที่ลูกค้าถามบ่อย'],\n      replies:['เข้าใจเลยครับ ผมจะเริ่มจากขอโทษและรับฟังก่อน แล้วค่อยเสนอทางแก้ 2 ข้อ\\n\\n(โหมดเดโม)', 'ได้ครับ ขอรายละเอียดคำสั่งซื้อของลูกค้าอีกนิด เพื่อให้คำตอบตรงที่สุด']},\n    analyst:{label:'วิเคราะห์ข้อมูล', name:'Data Analyst Agent', chip:'วิเคราะห์', style:'futuristic', color:'#B6D80B',\n      pattern:'ถามคำถามที่อยากรู้และแหล่งข้อมูลก่อน แล้วตอบเป็นข้อค้นพบพร้อมตัวเลข',\n      hello:['สวัสดีครับ ผมช่วยวิเคราะห์ข้อมูลร้านค้า\\n\\nมีคำถามอะไรที่อยากรู้จากข้อมูลครับ เช่น สินค้าไหนทำกำไรสุด และข้อมูลอยู่ที่ไหน (CSV / Google Sheets / แพลตฟอร์มร้านค้า)?'],\n      quick:['สินค้าไหนทำกำไรสุด', 'ลูกค้ากลุ่มไหนกลับมาซื้อซ้ำ', 'ยอดขายแยกตามช่องทาง'],\n      replies:['รับทราบครับ ผมจะตอบเป็น: ข้อค้นพบหลัก ตัวเลขประกอบ และข้อควรระวัง\\n\\n(โหมดเดโม ยังไม่มีข้อมูลจริง)', 'ได้ครับ ขอแหล่งข้อมูลและช่วงเวลาที่ต้องการวิเคราะห์ครับ']}\n  };\n  const PICKABLE = Object.keys(ROLES).filter(k => !ROLES[k].fixed);\n  const ROUTE = [\n    ['finance', /เงิน|กำไร|รายรับ|รายจ่าย|ภาษี|ต้นทุน|บัญชี/],\n    ['marketing', /โฆษณา|แคปชัน|แคมเปญ|คอนเทนต์|โปรโมชัน|การตลาด/],\n    ['legal', /กฎหมาย|pdpa|นโยบาย|สัญญา|ข้อกำหนด|คืนสินค้า/i],\n    ['market', /คู่แข่ง|เทรนด์|ตลาด|ราคา|อุตสาหกรรม/],\n    ['ops', /สต็อก|ออเดอร์|พัสดุ|จัดส่ง|สินค้าหมด/],\n    ['support', /ลูกค้า|ร้องเรียน|ไม่พอใจ|ตอบแชต/],\n    ['analyst', /วิเคราะห์|ข้อมูล|สถิติ|ซื้อซ้ำ/],\n    ['daily', /สรุป|วันนี้|เมื่อวาน|รายงาน/]\n  ];\n\n  /* ---------- state ---------- */\n  const mkBot = (team, role, color) => {\n    const R = ROLES[role];\n    return {id: uid(), name: R.name, role, color: color || R.color, team,\n      msgs: R.hello.map((t, i) => ({r:'bot', t, s: i === 0 ? stamp() : ''}))};\n  };\n  const mkSeed = () => {\n    const team = {id: uid(), name: 'ทีม 1', closed: false};\n    const bots = [mkBot(team.id, 'secretary'), ...PICKABLE.slice(0, 6).map(r => mkBot(team.id, r))];\n    return {teams:[team], bots, active: bots[0].id};\n  };\n  let S;\n  try { S = JSON.parse(localStorage.getItem(KEY)); } catch { S = null; }\n  const valid = s => s && Array.isArray(s.teams) && Array.isArray(s.bots) && s.bots.length && s.bots.every(b => ROLES[b.role] && typeof b.color === 'string');\n  if(!valid(S)) S = mkSeed();\n  // every team must have its Secretary\n  for(const t of S.teams) if(!S.bots.some(b => b.team === t.id && b.role === 'secretary')) S.bots.unshift(mkBot(t.id, 'secretary'));\n  if(!S.bots.some(b => b.id === S.active)) S.active = S.bots[0].id;\n  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };\n\n  /* ---------- 3D avatar service (snapshots of the ant, rendered in a hidden iframe) ---------- */\n  const AV = {ready:false, busy:null, queue:[], cache:{}};\n  try { AV.cache = JSON.parse(localStorage.getItem(AVKEY)) || {}; } catch {}\n  const avKey = (style, color) => style + '|' + color.toUpperCase();\n  const avSave = () => { try { const ks = Object.keys(AV.cache); if(ks.length > 40) ks.slice(0, ks.length - 40).forEach(k => delete AV.cache[k]); localStorage.setItem(AVKEY, JSON.stringify(AV.cache)); } catch {} };\n  function avPump(){\n    if(!AV.ready || AV.busy || !AV.queue.length) return;\n    const k = AV.queue.shift(); if(AV.cache[k]) return avPump();\n    AV.busy = k; const i = k.indexOf('|'), style = k.slice(0, i), color = k.slice(i + 1);\n    const f = $('#avsvc'); if(f && f.contentWindow) f.contentWindow.postMessage({type:'ant:render', id:k, style, color}, '*');\n    setTimeout(() => { if(AV.busy === k){ AV.busy = null; avPump(); } }, 6000);\n  }\n  function avRequest(k){ if(!AV.cache[k] && AV.busy !== k && !AV.queue.includes(k)){ AV.queue.push(k); avPump(); } }\n  function avApply(k){\n    const url = AV.cache[k]; if(!url) return;\n    document.querySelectorAll('.av').forEach(el => { if(el.dataset.k !== k) return; const img = el.querySelector('img'); if(img){ img.src = url; el.classList.add('has-img'); } });\n  }\n  window.addEventListener('message', e => {\n    const f = $('#avsvc'); if(!f || e.source !== f.contentWindow || !e.data) return;\n    if(e.data.type === 'ant:ready'){ AV.ready = true; avPump(); }\n    if(e.data.type === 'ant:rendered' && typeof ngClientRect();\n        const slot = document.createElement('div'); slot.className = 'drop-slot'; slot.style.height = r.height + 'px';\n        list.insertBefore(slot, btn);\n        btn.classList.add('dragging');\n        Object.assign(btn.style, {position:'fixed', left:r.left + 'px', top:r.top + 'px', width:r.width + 'px', zIndex:'50', margin:'0', pointerEvents:'none'});\n        list.classList.add('reordering');\n        try { btn.setPointerCapture(pid); } catch {}\n        $('#live-side').hidden = true; navigator.vibrate && navigator.vibrate(12);\n        drag = {btn, slot, pid, dy: sy - r.top, y: sy};\n        place();\n      }, dbl ? 0 : 350);\n    });\n    // where does the slot go? before the first row whose middle is below the pointer\n    function place(){\n      if(!drag) return;\n      const {btn, slot} = drag, y = drag.y;\n      btn.style.top = (y - drag.dy) + 'px';\n      let ref = null;\n      for(const o of items()){ const r = o.getBoundingClientRect(); if(y < r.top + r.height/2){ ref = o; break; } }\n      if(ref) list.insertBefore(slot, ref); else list.appendChild(slot);\n    }\n    let raf = 0;\n    function autoScroll(){\n      if(!drag) { raf = 0; return; }\n      const r = scroller.getBoundingClientRect(), y = drag.y, z = 56;\n      let d = 0; if(y < r.top + z) d = -Math.ceil((r.top + z - y)/6); else if(y > r.bottom - z) d = Math.ceil((y - (r.bottom - z))/6);\n      if(d){ scroller.scrollTop += d; place(); }\n      raf = requestAnimationFrame(autoScroll);\n    }\n    list.addEventListener('pointermove', e => {\n      if(!drag || e.pointerId !== drag.pid) return;\n      e.preventDefault(); drag.y = e.clientY; place();\n      if(!raf) raf = requestAnimationFrame(autoScroll);\n    }, {passive:false});\n    const end = e => {\n      if(!drag || (e && e.pointerId !== drag.pid)) return;\n      const {btn, slot} = drag; drag = null; cancelAnimationFrame(raf); raf = 0;\n      list.insertBefore(btn, slot); slot.remove();\n      btn.classList.remove('dr endChild(nt);\n    placeLive();\n  }\n\n  /* ---------- live 3D profile: the active employee's avatar (header + sidebar) watches the composer and works ----------\n     The frames are created once (warmed during boot) and switched with a message, so picking someone never reloads a model.\n     Until the live model confirms, the cached snapshot underneath stays visible. */\n  let liveState = 'idle';\n  const LIVE = {head:{el:$('#live-head'), key:'', built:false}, side:{el:$('#live-side'), key:'', built:false}};\n  const PF = {key:'', built:false};\n  const frameOf = L => L.el.querySelector('iframe');\n  const liveUrl = (b, look) => 'ant-mascot.html?av=1&look=' + look + '&role=' + encodeURIComponent(b.role) + '&style=' + encodeURIComponent(ROLES[b.role].style) + '&color=' + encodeURIComponent(b.color);\n  function livePost(){\n    const b = active(); if(!b) return;\n    for(const k of ['head', 'side']){\n      const f = frameOf(LIVE[k]);\n      if(f && f.contentWindow && LIVE[k].built) try { f.contentWindow.postMessage({type:'ant:state', state: liveState, role: b.role}, '*'); } catch {}\n    }\n  }\n  function applyLive(L, b, look){\n    const key = [ROLES[b.role].style, b.color.toUpperCase(), b.role].join('|');\n    if(L.key === key) return;\n    const f = frameOf(L); L.el.classList.remove('ready');\n    if(!L.key || !L.built){ L.built = false; f.src = liveUrl(b, look); }\n    else f.contentWindow.postMessage({type:'ant:config', style: ROLES[b.role].style, color: b.color, role: b.role, key}, '*');\n    L.key = key;\n  }\n  function warmLive(){\n    const b = active(); if(!b) return;\n    applyLive(LIVE.head, b, 'down'); applyLive(LIVE.side, b, 'diag');\n    const f = $('#pf-frame');\n    if(!PF.key){ PF.key = ROLES[b.role].style + '|' + b.color.toUpperCase(); f.src = 'ant-mascot.html?style=' + encodeURIComponent(ROLES[b.role].style) + '&color=' + encodeURIComponent(b.color); }\n  }\n  window.addEventListener('message', e => {\n    const d = e.data; if(!d) return;\n n\n  /* ---------- dashboard pages: overview / all tasks / tokens (demo data) ---------- */\n  let PAGE = '';\n  const TASKS = [\n    ['marketing', 'วางแคมเปญโปรโมชันสิ้นเดือนบน TikTok และ LINE OA', 'doing', 42],\n    ['ops', 'อัปเดตสต็อกสินค้าและแจ้งเตือนของใกล้หมด', 'doing', 96],\n    ['finance', 'สรุปรายรับ-รายจ่ายและกำไรสุทธิเดือนนี้', 'done', 115],\n    ['market', 'สรุปคู่แข่งในหมวดสินค้าเดียวกัน 8 ร้าน', 'done', 78],\n    ['legal', 'ตรวจเงื่อนไขการคืนสินค้าตามกฎหมายคุ้มครองผู้บริโภค', 'wait', 34],\n    ['secretary', 'จัดลำดับงานประจำวันและแจกให้แต่ละ Agent', 'done', 58],\n    ['daily', 'สรุปยอดขายและข่าวสำคัญประจำวัน', 'done', 27],\n    ['finance', 'คำนวณต้นทุนและราคาขายสินค้าใหม่ 5 รายการ', 'wait', 61],\n    ['ops', 'ประสานขนส่งและตรวจพัสดุที่ค้างจัดส่ง', 'doing', 49],\n    ['marketing', 'เขียนคอนเทนต์ 7 วัน พร้อมแคปชันและแฮชแท็ก', 'todo', '–'],\n    ['legal', 'ร่างข้อกำหนดการใช้งานและนโยบายความเป็นส่วนตัวของร้าน', 'todo', '–'],\n    ['market', 'คาดการณ์แนวโน้มสินค้ายอดนิยมไตรมาสหน้า', 'todo', '–']\n  ];\n  const ST = {doing:'กำลังทำ', done:'เสร็จแล้ว', wait:'รออนุมัติ', todo:'รอเริ่ม'};\n  const PACKS = [['500 Token', '500K tokens', 190], ['1,000 Token', '1M tokens', 350], ['5,000 Token', '5M tokens', 1590], ['20,000 Token', '20M tokens', 5900]];\n  const whoOf = role => { const b = S.bots.find(x => x.role === role); return {name: b ? b.name : ROLES[role].name, color: b ? b.color : ROLES[role].color}; };\n  const taskRow = t => { const w = whoOf(t[0]); return `<div class=\"trow\"><span class=\"tt\">${esc(t[1])}<\/span><span class=\"who\" style=\"--c:${esc(w.color)}\"><i><\/i><span>${esc(w.name)}<\/span><\/span><span class=\"st ${t[2]}\">${ST[t[2]]}<\/span><span class=\"tk\">${t[3]}<\/span><\/div>`; };\n  /* 30-day activity calendar: one square per day, labelled with its date, darker = more activity */\n  const DAYS = 30, DAY_MS = 864e5;\n  const METRICS = {\n    tasks:  {title: 'งานที่เสร็จ',        unit: 'งาน',   max: 8,  seed: 11, big: '28',   cap: 'งานที่เสร็จสัปดาห์นี้'},\n    tokens: {title: 'Token ที่ใช้',        unit: 'Token', max: 90, seed: 23, big: '860',  cap: 'Token ที่ใช้'},\n    time:   {title: 'เวลาเฉลี่ยต่องาน',   unit: 'นาที',  max: 12, seed: 37, big: '6:12', cap: 'เวลาเฉลี่ยต่องาน'}\n  };\n  let METRIC = 'tasks';\n  const WD = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'], WD_FULL = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];\n  function series(m){\n    let s = m.seed; const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;\n    const today = new Date(); today.setHours(0, 0, 0, 0);\n    const start = new Date(today.getTime() - (DAYS - 1) * DAY_MS);\n    return Array.from({length: DAYS}, (_, d) => {\n      const day = new Date(start.getTime() + d * DAY_MS), wk = day.getDay() === 0 || day.getDay() === 6;\n      const v = rnd() < (wk ? .45 : .12) ? 0 : Math.max(1, Math.round(m.max * Math.pow(rnd(), wk ? 1.7 : .9)));\n      return {day, v, lv: v === 0 ? 0 : Math.min(4, 1 + Math.floor(v / (m.max / 4 + .001))), today: d === DAYS - 1};\n    });\n  }\n  const fmtDay = d => WD_FULL[d.getDay()] + ' ' + d.toLocaleDateString('th-TH', {day: 'numeric', month: 'short'});\n  function calHTML(key){\n    const m = METRICS[key], ser = series(m), total = ser.reduce((a, x) => a + x.v, 0), best = ser.reduce((a, x) => x.v > a.v ? x : a, ser[0]);\n    const active = ser.filter(x => x.v > 0).length;\n    const lead = ser[0].day.getDay(), cols = Math.ceil((lead + DAYS) / 7);\n    let grid = '<div><\/div>' + WD.map((w, i) => `<div class=\"cal-wd${i === 0 || i === 6 ? ' we' : ''}\">${w}<\/div>`).join('');\n    for(let c = 0; c < cols; c++){\n      const first = ser[Math.max(0, c * 7 - lead)];\n      grid += `<div class=\"cal-wk\">${first.day.getDate()} ${first.day.toLocaleDateString('th-TH', {month: 'short'})}<\/div>`;\n      for(let r = 0; r < 7; r++){\n        const i = c * 7 + r - lead, x = ser[i];\n        if(!x){ grid += '<span class=\"hc e\"><\/span>'; continue; }\n        grid += `<button class=\"hc${x.today ? ' today' : ''}\" data-l=\"${x.lv}\" data-i=\"${i}\" aria-label=\"${fmtDay(x.day)}: ${x.v} ${m.unit}\">${x.day.getDate()}${x.today ? '<span class=\"tag\">วันนี้<\/span>' : ''}<\/button>`;\n      }\n    }\n    const sumTxt = key === 'time' ? 'เฉลี่ย ' + (total / Math.max(1, active)).toFixed(1) + ' นาที/งาน' : total.toLocaleString('en-US') + ' ' + m.unit;\n    return `<div class=\"cal-h\"><b>${m.title}<\/b><small>30 วันล่าสุด · 1 ช่อง = 1 วัน ตัวเลขในช่องคือวันที่ แต่ละคอลัมน์คือ 1 สัปดาห์<\/small><\/div>\n      <div class=\"cal-read\" id=\"cal-read\" aria-live=\"polite\">วันนี้: <b>${ser[DAYS - 1].v} ${m.unit}<\/b><\/div>\n      <div class=\"cal-grid\" id=\"cal-grid\" style=\"grid-template-columns:34px repeat(${cols},minmax(0,1fr))\">${grid}<\/div>\n      <div class=\"cal-legend\"><span>น้อย<\/span><i><\/i><i data-l=\"1\"><\/i><i data-l=\"2\"><\/i><i data-l=\"3\"><\/i><i data-l=\"4\"><\/i><span>มาก<\/span><\/div>\n      <div class=\"cal-sum\"><span><b>${sumTxt}<\/b>รวม/เฉลี่ย 30 วัน<\/span><span><b>${active} วัน<\/b>ที่มีการใช้งาน<\/span><span><b>${fmtDay(best.day)}<\/b>ใช้มากที่สุด (${best.v} ${m.unit})<\/span><\/div>`;\n  }\n  function bindCal(){\n    const g = $('#cal-grid'); if(!g) return;\n    const ser = series(METRICS[METRIC]), m = METRICS[METRIC], rd = $('#cal-read');\n    const show = i => { const x = ser[i]; rd.innerHTML = `${fmtDay(x.day)}${x.today ? ' (วันนี้)' : ''}: <b>${x.v} ${m.unit}<\/b>`; };\n    g.querySelectorAll('.hc[data-i]').forEach(c => { const i = +c.dataset.i; c.onmouseenter = c.onfocus = c.onclick = () => show(i); });\n    g.onmouseleave = () => show(DAYS - 1);\n    document.querySelectorAll('.stat').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.m === METRIC)));\n  }\n  const statCard = k => { const m = METRICS[k]; return `<button class=\"stat\" data-m=\"${k}\" aria-pressed=\"${k === METRIC}\"><small>${m.cap}<\/small><b>${m.big}<\/b><span class=\"hint\">ดูปฏิทิน 30 วัน ↓<\/span><\/button>`; };\n  function pageHTML(p){\n    const head = (title, meta) => `<div class=\"pg-head\"><button class=\"back\" id=\"pg-back\" aria-label=\"กลับไปรายชื่อ\">${ico.back}<\/button><h2>${title}<\/h2>${meta ? `<span class=\"meta\">${meta}<\/span>` : ''}<\/div>`;\n    if(p === 'overview') return head('ภาพรวม') + `\n      <div class=\"stats\">${Object.keys(METRICS).map(statCard).join('')}<\/div>\n      <section class=\"pg-panel cal\" id=\"cal\">${calHTML(METRIC)}<\/section>\n      <section class=\"pg-panel\"><div class=\"pg-panel-h\">งานที่ Secretary แจกวันนี้<span>5 TASKS<\/span><\/div>${TASKS.slice(0, 5).map(taskRow).join('')}<\/section>`;\n    if(p === 'tasks') return head('งานทั้งหมดในรอบนี้', TASKS.length + ' TASKS') + `<section class=\"pg-panel\">${TASKS.map(taskRow).join('')}<\/section>`;\n    return head('Token') + `\n      <section class=\"tok-bal\">\n        <small>Token คงเหลือรอบนี้<\/small>\n        <div class=\"big\"><b>2,140<\/b><em>≈ 2,140,000 tokens<\/em><\/div>\n        <div class=\"meter\" role=\"img\" aria-label=\"ใช้ไปแล้ว 860 จาก 3,000\"><i style=\"width:71%\"><\/i><\/div>\n        <div class=\"pg-foot\"><span>ใช้ไป 860 Token<\/span><span>รีเซ็ต 1 พ.ย.<\/span><\/div>\n      <\/section>\n      <div class=\"packs\">${PACKS.map((k, i) => `<button class=\"pack\" data-pack=\"${i}\"><b>${k[0]}<\/b><small>${k[1]}<\/small><span class=\"pr\">฿${k[2].toLocaleString('en-US')}<\/span><\/button>`).join('')}<\/div>\n      <p class=\"demo-note\" id=\"demo-note\" role=\"status\"><\/p>`;\n  }\n  function leavePage(){\n    PAGE = ''; $('#page').hidden = true; $('#chat').hidden = false;\n    document.querySelectorAll('#snav button').forEach(b => b.removeAttribute('aria-current'));\n  }\n  function setPage(p){\n    if(!p){ leavePage(); renderSide(); return; }\n    PAGE = p;\n    const pg = $('#page');\n    pg.hidden = false; $('#chat').hidden = true;\n    document.querySelectorAll('#snav button').forEach(b => { if(b.dataset.page === p) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });\n    pg.innerHTML = pageHTML(p); pg.scrollTop = 0;\n    $('#app').dataset.view = 'chat';\n    const back = $('#pg-back'); if(back) back.onclick = () => { $('#app').dataset.view = 'list'; };\n    pg.querySelectorAll('.stat').forEach(b => b.onclick = () => { METRIC = b.dataset.m; $('#cal').innerHTML = calHTML(METRIC); bindCal(); });\n    bindCal();\n    pg.querySelectorAll('.pack').forEach(btn => btn.onclick = () => { $('#demo-note').textContent = 'โหมดเดโม: ยังไม่เปิดให้ซื้อ Token จริง (' + PACKS[btn.dataset.pack][0] + ')'; });\n    renderSide();\n  }\n  document.querySelectorAll('#snav button').forEach(b => b.onclick = () => setPage(PAGE === b.dataset.page ? '' : b.dataset.page));\n\n  renderSide(); renderChat();\n  if(!$('#avsvc').dataset.src) warmLive();\n  if(matchMedia('(min-width:721px)').matches) $('#app').dataset.view = 'chat';\n})();\n\n<\/script>\n<script>\n(function(){var r=function(){var on=location.hash==='#app';document.documentElement.classList.toggle('ws-on',on);if(on)window.scrollTo(0,0)};addEventListener('hashchange',r);r();})();\n(function(){\n  var B = window.__boot; if(!B) return;\n  var t0 = Date.now(), hero = false, ready = false;\n  var WS = function(){ return window.SoloraWS || {progress:function(){return {done:0,total:1}}, start:function(){}}; };\n  var inApp = function(){ return location.hash === '#app'; };\n  function startPreload(){ if(hero) return; hero = true; B.set(70); setTimeout(function(){ WS().start(); }, 7000); }\n  addEventListener('message', function(e){\n    if(!e.data || e.data.type !== 'ant:shown') return;\n    var f = document.querySelector('.hero-ant iframe');\n    if(f && e.source === f.contentWindow) startPreload();\n  });\n  B.set(45, 'Loading Antistant...');\n  function tick(){\n    var age = Date.now() - t0;\n    if(!hero && age > 25000) startPreload();\n    var p = WS().progress(), frac = p.total ? p.done/p.total : 0;\n    if(hero){ B.set(70 + 30*frac); if(p.total && p.done >= p.total) ready = true; }\n    if(inApp() && age > 70000) ready = true;\n    if(inApp()){\n      if(hero && ready) B.hide(); else B.show('Preparing for your team...');\n    } else if(hero){\n      B.hide();\n    }\n  }\n  setInterval(tick, 250); tick();\n})();\n<\/script>\n<script>/* Optional diagnostics: open the page with ?debug=1 to see viewport / overflow info in the corner. */\n(function () {\n  if (!/[?&]debug\\b/.test(location.search)) return;\n  var box = document.createElement('pre');\n  box.style.cssText = 'position:fixed;left:8px;bottom:8px;z-index:2147483647;margin:0;padding:8px 10px;max-width:92vw;max-height:46vh;overflow:auto;background:rgba(0,0,0,.82);color:#7CFC9A;font:11px/1.4 ui-monospace,Consolas,monospace;border-radius:8px;white-space:pre-wrap;pointer-events:auto';\n  function scan() {\n    var de = document.documentElement, off = [];\n    document.querySelectorAll('body *').forEach(function (e) {\n      if (e.closest('#__bundler_thumbnail') || e === box) return;\n      var r = e.getBoundingClientRect(); if (!r.width) return;\n      if (r.right > de.clientWidth + 1 || r.left < -1) {\n        var cs = getComputedStyle(e); if (cs.display === 'none' || cs.visibility === 'hidden') return;\n        var cn = typeof e.className === 'string' ? e.className.split(' ')[0] : e.tagName;\n        off.push((e.id ? '#' + e.id : '') + '.' + cn + ' [' + Math.round(r.left) + '..' + Math.round(r.right) + '] ' + cs.position + (e.closest('#ws') ? ' (ws)' : ''));\n      }\n    });\n    var vv = window.visualViewport;\n    box.textContent = 'inner ' + innerWidth + 'x' + innerHeight + '  dpr ' + devicePixelRatio + '  outer ' + outerWidth + 'x' + outerHeight + '  screen ' + screen.width + 'x' + screen.height +\n      '\\nclientW ' + de.clientWidth + '  scrollW ' + de.scrollWidth + '  scrollX ' + Math.round(scrollX) + '  visualViewport ' + (vv ? Math.round(vv.width) + 'x' + Math.round(vv.height) + ' @' + vv.scale.toFixed(2) : '-') +\n      '\\nhash ' + location.hash + '  ws-on ' + de.classList.contains('ws-on') +\n      '\\noffenders ' + off.length + '\\n' + off.slice(0, 14).join('\\n');\n  }\n  function start() { document.body.appendChild(box); scan(); setInterval(scan, 700); }\n  if (document.readyState === 'complete') start(); else addEventListener('load', start);\n})();\n<\/script><\/body><\/html>"
